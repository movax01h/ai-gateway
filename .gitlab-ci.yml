---
workflow:
  auto_cancel:
    on_new_commit: none
  rules:
    # The sync schedule of the security fork only needs merge-train-trigger.
    # These variables stop the scanner template jobs. The include and job rules
    # with .if-security-sync-schedule stop the other jobs.
    - if: $CI_PROJECT_ID == "61869127" && $CI_PIPELINE_SOURCE == "schedule" && $MERGE_TRAIN == "true"
      variables:
        SAST_DISABLED: "true"
        SECRET_DETECTION_DISABLED: "true"
        CONTAINER_SCANNING_DISABLED: "true"
    # This works around an issue that prevents usage of the dependency proxy
    # when the pipeline is triggered by a project access token, regardless of
    # which pipeline source triggered it.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $GITLAB_USER_LOGIN =~ /project_\d+_bot\d*/'
      auto_cancel:
        on_new_commit: conservative
      variables:
        GITLAB_DEPENDENCY_PROXY_ADDRESS: ""
    - if: '$GITLAB_USER_LOGIN =~ /project_\d+_bot\d*/'
      variables:
        GITLAB_DEPENDENCY_PROXY_ADDRESS: ""

    # Merge requests that change a file outside docs/ and .gitlab/duo/ get the
    # full pipeline. docs/flow_registry/experimental.md also counts as code,
    # because tests:unit reads it. Add a doc here when a test starts to read it.
    # Any other path counts as code.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        regexp: '\A(?!docs/|\.gitlab/duo/)|\Adocs/flow_registry/experimental\.md\z'
      auto_cancel:
        on_new_commit: conservative
    # Merge requests that change only docs paths skip the image builds, the
    # code tests and the scans. See .skip-on-docs-only-mr.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: conservative
      variables:
        DOCS_ONLY_MR: "true"
        SAST_DISABLED: "true"
        CONTAINER_SCANNING_DISABLED: "true"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^stable-\d+-\d+-ee$/
    - if: $CI_COMMIT_TAG

image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}python:3.12.15

default:
  interruptible: true

stages:
  - build
  - test
  - deploy-review
  - validate
  - release
  - ingest
  - runway_staging
  - runway_production
  - deploy_pages

variables:
  # We set $GITLAB_DEPENDENCY_PROXY to another variable (since it's set at the
  # group level and has higher precedence than .gitlab-ci.yml) so that we can
  # override $GITLAB_DEPENDENCY_PROXY_ADDRESS in workflow rules.
  GITLAB_DEPENDENCY_PROXY_ADDRESS: "${GITLAB_DEPENDENCY_PROXY}"

  # For job rules only: include rules are evaluated before this block applies,
  # so the .if-not-*-project anchors keep the literal IDs.
  CANONICAL_PROJECT_ID: "39903947"
  SECURITY_PROJECT_ID: "61869127"

  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/poetry"
  POETRY_VERSION: "2.4.1"

  DOCKER_VERSION: "29.1.2"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_MODEL_GATEWAY: "$CI_REGISTRY_IMAGE/model-gateway"
  DOCKER_INGEST: "$CI_REGISTRY_IMAGE/ingest"
  DOCKERHUB_MODEL_GATEWAY: "gitlab/model-gateway"

  TARGET_IMAGE: "$DOCKER_MODEL_GATEWAY:$CI_COMMIT_SHORT_SHA"
  INGEST_IMAGE: "$DOCKER_INGEST:$CI_COMMIT_SHORT_SHA"
  SELF_HOSTED_TARGET_IMAGE: "$DOCKER_MODEL_GATEWAY/self-hosted:$CI_COMMIT_SHORT_SHA"

  FIPS_TARGET_IMAGE: "$DOCKER_MODEL_GATEWAY/fips:$CI_COMMIT_SHORT_SHA"
  SELF_HOSTED_FIPS_TARGET_IMAGE: "$DOCKER_MODEL_GATEWAY/self-hosted-fips:$CI_COMMIT_SHORT_SHA"

  DOCS_LINT_IMAGE: "registry.gitlab.com/gitlab-org/technical-writing/docs-gitlab-com/lint-markdown:alpine-3.24-vale-3.21.0-markdownlint2-0.23.2-lychee-0.24.2-rumdl-0.2.69"

  SAST_EXCLUDED_PATHS: "tests, tmp, api"
  CS_IMAGE: $TARGET_IMAGE

.if-merge-request-labels-pipeline-expedited: &if-merge-request-labels-pipeline-expedited
  if: '$CI_MERGE_REQUEST_LABELS =~ /pipeline::expedited/'

.if-commit-message-pipeline-expedited: &if-commit-message-pipeline-expedited
  if: '$CI_COMMIT_MESSAGE =~ /pipeline_expedited:\s*true/'

.if-not-canonical-project: &if-not-canonical-project
  if: $CI_PROJECT_ID != "39903947"

.if-not-security-project: &if-not-security-project
  if: $CI_PROJECT_ID != "61869127"

.if-not-canonical-nor-security-project: &if-not-canonical-nor-security-project
  if: $CI_PROJECT_ID != "39903947" && $CI_PROJECT_ID != "61869127"

# Canonical v1.x tags point at a commit main already built, so their pipeline
# only retags that image. self-hosted-* tags and the fork keep full pipelines.
# Only semantic-release creates tags that start with a "v".
.if-version-tag: &if-version-tag
  if: $CI_PROJECT_ID == "39903947" && $CI_COMMIT_TAG =~ /^v\d/

# The MERGE_TRAIN=true schedule of the security fork only runs merge-train-trigger.
# The project ID check keeps this rule out of all other projects.
# Include rules use this condition directly, because GitLab evaluates them
# before it applies workflow variables.
# Add this rule to a new include or a new job in this file, so that the sync
# schedule stays small.
.if-security-sync-schedule: &if-security-sync-schedule
  if: $CI_PROJECT_ID == "61869127" && $CI_PIPELINE_SOURCE == "schedule" && $MERGE_TRAIN == "true"

.skip-when-expedited-or-version-tag-include: &skip-when-expedited-or-version-tag-include
  - <<: *if-security-sync-schedule
    when: never
  - <<: *if-version-tag
    when: never
  - <<: *if-merge-request-labels-pipeline-expedited
    when: never
  - <<: *if-commit-message-pipeline-expedited
    when: never
  - when: always

.skip-if-not-canonical: &skip-if-not-canonical
  - <<: *if-not-canonical-project
    when: never
  - when: always

# The sync schedule does not deploy, so it also skips the Runway includes.
.skip-if-not-security-or-sync-schedule: &skip-if-not-security-or-sync-schedule
  - <<: *if-not-security-project
    when: never
  - <<: *if-security-sync-schedule
    when: never
  - when: always

.skip-if-not-canonical-nor-security: &skip-if-not-canonical-nor-security
  - <<: *if-not-canonical-nor-security-project
    when: never
  - when: always

# Put this block first in the rules of the jobs that only build or test the
# code. This file is always included, so the expedited pipelines that skip the
# lint and test includes can still reference it.
.skip-on-docs-only-mr:
  rules:
    - if: $DOCS_ONLY_MR == "true"
      when: never

include:
  # Release jobs `need` the build jobs, so skip this include only when the
  # release include is also skipped.
  - local: .gitlab/ci/build.gitlab-ci.yml
    rules:
      - <<: *if-security-sync-schedule
        when: never
      - when: always
  - local: .gitlab/ci/lint.gitlab-ci.yml
    rules: *skip-when-expedited-or-version-tag-include
  - local: .gitlab/ci/dependency-review.gitlab-ci.yml
  - local: .gitlab/ci/test.gitlab-ci.yml
    rules: *skip-when-expedited-or-version-tag-include
  - local: .gitlab/ci/performance.gitlab-ci.yml
    rules: *skip-when-expedited-or-version-tag-include
  - local: .gitlab/ci/release.gitlab-ci.yml
    rules:
      - <<: *if-not-canonical-nor-security-project
        when: never
      - <<: *if-security-sync-schedule
        when: never
      - <<: *if-merge-request-labels-pipeline-expedited
        when: never
      - <<: *if-commit-message-pipeline-expedited
        when: never
      - when: always
  - local: .gitlab/ci/stable-tagging.gitlab-ci.yml
    rules: *skip-if-not-canonical-nor-security
  - local: .gitlab/ci/ingest.gitlab-ci.yml
    rules: *skip-when-expedited-or-version-tag-include
  - template: Jobs/Container-Scanning.latest.gitlab-ci.yml
  # Do not include Jobs/Dependency-Scanning.latest.gitlab-ci.yml. GitLab security
  # settings outside this file add the dependency-scanning-profile-0 job, which
  # scans all the lock files. The template only adds duplicate Gemnasium jobs.
  - template: Jobs/SAST.latest.gitlab-ci.yml
  - template: Jobs/Secret-Detection.latest.gitlab-ci.yml

  # Analyze commits to determine whether to cut a release
  # see https://gitlab.com/gitlab-com/gl-infra/common-ci-tasks/-/blob/main/semantic-release.md
  - project: "gitlab-com/gl-infra/common-ci-tasks"
    ref: v4.45.0  # renovate:managed
    file: "semantic-release.yml"
    rules: *skip-if-not-canonical
  # Overrides the job above, so it must stay after it. Only canonical main
  # pipelines get the override; any other run uses the shared job unchanged.
  - local: .gitlab/ci/semantic-release.gitlab-ci.yml
    rules:
      - if: $CI_PROJECT_ID == "39903947" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

  # Runway (Cloud Run)
  - project: "gitlab-com/gl-infra/platform/runway/runwayctl"
    file: "ci-tasks/service-project/runway.yml"
    inputs:
      runway_service_id: ai-gateway
      image: "$CI_REGISTRY_IMAGE/model-gateway:${CI_COMMIT_SHORT_SHA}"
      runway_version: v4.143.0
    rules: *skip-if-not-security-or-sync-schedule
  - project: "gitlab-com/gl-infra/platform/runway/runwayctl"
    file: "ci-tasks/service-project/runway.yml"
    inputs:
      runway_service_id: duo-workflow-svc
      image: "$CI_REGISTRY_IMAGE/model-gateway:${CI_COMMIT_SHORT_SHA}"
      runway_version: v4.143.0
    rules: *skip-if-not-security-or-sync-schedule
  - project: "gitlab-com/gl-infra/platform/runway/runwayctl"
    file: "ci-tasks/service-project/runway.yml"
    inputs:
      runway_service_id: ai-gateway-custom
      image: "$SELF_HOSTED_TARGET_IMAGE"
      runway_version: v4.143.0
    rules: *skip-if-not-security-or-sync-schedule

  # Runway (Kubernetes)
  - project: "gitlab-com/gl-infra/platform/runway/runwayctl"
    file: "ci-tasks/service-project/helm-chart.yml"
    ref: v4.62.2
    inputs:
      runway_service_id: ai-gateway-eks
      runway_version: v4.143.0
      runtime: eks
      app_version: "${CI_COMMIT_SHORT_SHA}"
    rules: *skip-if-not-canonical
  - project: "gitlab-com/gl-infra/platform/runway/runwayctl"
    file: "ci-tasks/service-project/helm-chart.yml"
    ref: v4.62.2
    inputs:
      runway_service_id: duo-workflow-svc-eks
      runway_version: v4.143.0
      runtime: eks
      app_version: "${CI_COMMIT_SHORT_SHA}"
    rules: *skip-if-not-canonical

  - component: ${CI_SERVER_FQDN}/gitlab-org/components/danger-review/danger-review@2.1.0
    rules: &danger-review-include-rules
      # The security mirror's job token allowlist rejects the component's cross-project git fetch (#3731)
      - if: $CI_PROJECT_ID == "39903947" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == "61869127"
        when: never
      - if: $CI_SERVER_HOST == "gitlab.com"
  # Adds a gem cache to the danger-review job. Same rules as the component,
  # because without the component the job would have no script.
  - local: .gitlab/ci/danger-review.gitlab-ci.yml
    rules: *danger-review-include-rules
  - component: $CI_SERVER_FQDN/gitlab-org/analytics-section/analytics-instrumentation/ci-components/internal_events_validation@v1.1.0
    rules:
      - if: $CI_SERVER_HOST == "gitlab.com"
    inputs:
      stage: "validate"
      version: "1.1.1"

# Overwrite internal_events_validation to start as soon as possible.
# The component include stays in the sync schedule, because this override
# has no script. A job rule removes the job instead.
Internal event definitions validation:
  needs: []
  rules:
    - <<: *if-security-sync-schedule
      when: never
    - if: $CI_SERVER_HOST == "gitlab.com"

# Use the same larger runner as tests:unit so the analyzer has enough CPU/memory
# to run its multi-core scan instead of falling back to a single core.
# Cache taint-signature analysis results between pipeline runs so unchanged
# files are not re-analyzed on every scan.
# https://docs.gitlab.com/user/application_security/sast/gitlab_advanced_sast/#incremental-scanning
# The analyzer uses one core less than MAX_UNVERIFIED_CORES (default 4).
# A value of 8 gives 7 workers on the 8-core runner, with about 4 GB of memory each.
# https://docs.gitlab.com/user/application_security/sast/gitlab_advanced_sast/#tune-runner-resources
gitlab-advanced-sast:
  needs: []
  tags:
    - saas-linux-large-amd64
  variables:
    GITLAB_ADV_SAST_INCR_SCAN: "true"
    MAX_UNVERIFIED_CORES: "8"

# secret_detection only needs the source, not the build.
secret_detection:
  needs: []

.poetry:
  variables:
    POETRY_VIRTUALENVS_IN_PROJECT: "true"
    # The install job puts Poetry in its own virtualenv here, and the cache keeps it.
    # This directory is separate from the Poetry download cache in $POETRY_CACHE_DIR.
    # The version in the path makes a new POETRY_VERSION install a new copy.
    CACHED_POETRY_DIR: "$CI_PROJECT_DIR/.cache/installed-poetry-$POETRY_VERSION"
  cache:
    key:
      files:
        - poetry.lock
        - .gitlab-ci.yml
    policy: pull
    # The Poetry download cache ($POETRY_CACHE_DIR) is not in the cache. The
    # `install` job does not restore the cache, and other jobs skip
    # `poetry install` when `.venv` exists. No job reads it, so it only adds
    # upload and download time.
    paths:
      - $PIP_CACHE_DIR
      - .venv/
      - scripts/lib/
      - scripts/vendor/
      - $CACHED_POETRY_DIR
  # Use the cached Poetry when it exists. Install it with pip on a cold cache.
  # Only the poetry symlink goes on PATH, so python and pip stay the image's.
  before_script:
    - |
      if [ -x "$CACHED_POETRY_DIR/bin/poetry" ] && [ -x "$CACHED_POETRY_DIR/venv/bin/python" ]; then
        export PATH="$CACHED_POETRY_DIR/bin:$PATH"
      else
        pip install poetry==${POETRY_VERSION}
      fi

.docker:
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}docker:${DOCKER_VERSION}
  services:
    - name: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    REGISTRY_USER: "$CI_REGISTRY_USER"
    REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    REGISTRY: "$CI_REGISTRY"
  before_script:
    - docker login -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD" "$REGISTRY"

pages:
  stage: deploy_pages
  # The script reads only files in the repository, so the job does not wait for
  # other jobs or download their artifacts.
  needs: []
  script:
    - mkdir -p public
    - python -m scripts.prompt_directory_json_builder
  artifacts:
    paths:
      - public
  rules:
    - <<: *if-security-sync-schedule
      when: never
    - <<: *if-merge-request-labels-pipeline-expedited
      when: never
    - <<: *if-commit-message-pipeline-expedited
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Replays canonical commits into the security fork while a security fix is embargoed,
# so canonical's push mirror does not start failing once the two branches diverge.
# Triggered by a MERGE_TRAIN=true pipeline schedule on the fork; the runbook is in
# docs/delivery/security_fixes.md.
# GitLab does not run a pipeline with jobs only in .pre and .post. This job is
# the only job of the sync schedule. Thus it uses a regular stage and waits for
# no other job.
merge-train-trigger:
  stage: release
  needs: []
  resource_group: merge-train-$CI_PROJECT_PATH
  rules:
    - *if-security-sync-schedule
  trigger:
    project: gitlab-org/merge-train
    branch: master
    strategy: depend
  variables:
    # Selects merge-train's gitlab.com HTTPS job over its ops.gitlab.net SSH one.
    MERGE_RELEASE_PLATFORM: "1"
    TRIGGER_TARGET_PIPELINE: "1"
    SOURCE_PROJECT: gitlab-org/modelops/applied-ml/code-suggestions/ai-assist
    SOURCE_BRANCH: main
    TARGET_PROJECT: $CI_PROJECT_PATH
    TARGET_BRANCH: $CI_DEFAULT_BRANCH
