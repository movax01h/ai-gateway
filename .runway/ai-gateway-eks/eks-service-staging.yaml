apiVersion: runway/v1
kind: RunwayKubernetesDeployment

ai-gateway-eks:
  metadata:
    labels:
      gitlab.com/department: eng-dev
      gitlab.com/department_group: eng-dev-create-shared-infra
      gitlab.com/product_category: code_creation
      gitlab.com/owner_email_handle: mnohr

  serviceMixins:
    - "runway-eks.service-mixin"

  spec:
    environment:
      AIGW_ENVIRONMENT: "staging"
      AIGW_GITLAB_URL: "https://staging.gitlab.com"
      AIGW_GITLAB_API_URL: "https://staging.gitlab.com/api/v4/"
      AIGW_CUSTOMER_PORTAL_URL: "https://customers.staging.gitlab.com"
      AIGW_GLGO_BASE_URL: "https://auth.aws.staging.gitlab.com"
      AIGW_GOOGLE_CLOUD_PLATFORM__PROJECT: "gitlab-ai-framework-stage"
      AIGW_VERTEX_SEARCH__FALLBACK_DATASTORE_VERSION: "17.6"
      AIGW_SNOWPLOW__ENABLED: "false"
      AIGW_INTERNAL_EVENT__ENABLED: "false"
      AIGW_BILLING_EVENT__ENABLED: "true"
      AIGW_BILLING_EVENT__ENDPOINT: "https://billing.stgsub.gitlab.net"
      AIGW_BILLING_EVENT__NAMESPACE: "gl"
      AIGW_BILLING_EVENT__BATCH_SIZE: 1
      AIGW_BILLING_EVENT__THREAD_COUNT: "5"
      AIGW_FEATURE_FLAGS__FIREWORKS_SCORE_THRESHOLD: '{"qwen2p5-coder-7b": -1.5}'
      # Answer HTTP 413 for request bodies over 16 MiB on the HTTP routes, except /v1/proxy/.
      # https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/work_items/3404
      AIGW_REQUEST_BODY_LIMIT__MAX_BYTES: "16777216"
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp-service-account/credentials.json"
      # Per-actor in-flight limits, log mode: serve every request and record which ones the
      # current limits would reject. Switch to "enforce" once a week of data has sized the limits.
      AIGW_CODE_SUGGESTIONS__ACTOR_LIMIT_MODE: "log"
      AIGW_PROMPTS__ACTOR_LIMIT_MODE: "log"
    scalability:
      min_instances: 1
      max_instances: 4

  workloadSecrets:
    - name: env-vars
    - name: gcp-service-account

  secretEnvFrom:
    - env-vars

  secretVolumes:
    - name: gcp-service-account
      path: /secrets/gcp-service-account
