AIGW_FASTAPI__API_PORT: "8080"
AIGW_ENVIRONMENT: "production"
AIGW_GITLAB_URL: "https://gitlab.com"
AIGW_GITLAB_API_URL: "https://gitlab.com/api/v4/"
AIGW_CUSTOMER_PORTAL_URL: "https://customers.gitlab.com"
AIGW_GLGO_BASE_URL: "https://auth.token.gitlab.com"
AIGW_GOOGLE_CLOUD_PLATFORM__PROJECT: "gitlab-ai-framework-leg-prod"
AIGW_VERTEX_SEARCH__FALLBACK_DATASTORE_VERSION: "18.9"
AIGW_SNOWPLOW__ENABLED: "true"
AIGW_SNOWPLOW__ENDPOINT: "https://events.gitlab.net"
AIGW_SNOWPLOW__BATCH_SIZE: 1
AIGW_SNOWPLOW__THREAD_COUNT: 1
AIGW_INTERNAL_EVENT__ENABLED: "true"
AIGW_INTERNAL_EVENT__ENDPOINT: "https://events.gitlab.net"
AIGW_INTERNAL_EVENT__BATCH_SIZE: 1
AIGW_INTERNAL_EVENT__THREAD_COUNT: 5
AIGW_BILLING_EVENT__ENABLED: "true"
AIGW_BILLING_EVENT__ENDPOINT: "https://billing.prdsub.gitlab.net"
AIGW_BILLING_EVENT__NAMESPACE: "gl"
AIGW_BILLING_EVENT__BATCH_SIZE: 1
AIGW_BILLING_EVENT__THREAD_COUNT: 5
HOME: "/root"
AIGW_FASTAPI__METRICS_HOST: "0.0.0.0"
AIGW_FASTAPI__METRICS_PORT: "8082"
AIGW_GOOGLE_CLOUD_PROFILER__ENABLED: "false"
AIGW_INSTRUMENTATOR__THREAD_MONITORING_ENABLED: "True"
AIGW_INSTRUMENTATOR__THREAD_MONITORING_INTERVAL: 60
AIGW_FEATURE_FLAGS__DISALLOWED_FLAGS: '{"self-managed": ["expanded_ai_logging", "ai_model_release"]}'
AIGW_CLOUD_CONNECTOR_SERVICE_NAME: "gitlab-ai-gateway"
AIGW_AMAZON_Q__REGION: "us-east-1"
AIGW_AMAZON_Q__ENDPOINT_URL: "https://us-east-1.prod.integration.qdev.ai.aws.dev"
AIGW_FEATURE_FLAGS__FIREWORKS_SCORE_THRESHOLD: '{"qwen2p5-coder-7b": -1.5}'
AIGW_BIND_TOOLS_CACHE__ENABLED: "false"
# Answer HTTP 413 for request bodies over 16 MiB on the HTTP routes, except /v1/proxy/.
# https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/work_items/3404
AIGW_REQUEST_BODY_LIMIT__MAX_BYTES: "16777216"
# Per-actor in-flight limits, log mode: serve every request and record which ones the
# current limits would reject. Switch to "enforce" once a week of data has sized the limits.
AIGW_CODE_SUGGESTIONS__ACTOR_LIMIT_MODE: "log"
AIGW_PROMPTS__ACTOR_LIMIT_MODE: "log"
# Paid credit models gate, log mode: record which paid model requests would be denied
# for self-managed trials without purchased credits. Staging enforces first.
AIGW_MODEL_SELECTION__PAID_CREDIT_MODELS_GATE_MODE: "log"
