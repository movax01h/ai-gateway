---
# Custom instructions for GitLab Duo Code Review
# Adapted for the AI Gateway / Duo Workflow Service Python codebase
#
# References:
# - AGENTS.md: Repository conventions and architecture overview
# - Clean Architecture: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
# - Dependency Injector: https://python-dependency-injector.ets-labs.org/
# - FastAPI: https://fastapi.tiangolo.com/
# - Pydantic: https://docs.pydantic.dev/

# This file defines custom review criteria applied to specific files
# during merge request reviews. Instructions are grouped by name and can target
# multiple file patterns using glob syntax.
instructions:
  - name: General Python Standards
    fileFilters:
      - "**/*.py"
      - "!tests/**/*"
    instructions: |
      1. Ensure inclusive language is used where applicable, e.g. prefer `allowlist` over `whitelist`.
      1. Verify type hints are present on all functions and methods (mypy is enforced incrementally).
        This applies to inner/local helper functions and closures as well, not just top-level definitions.
      1. Ensure Google-style docstrings are used for public classes and functions, wrapped at 120 characters.
      1. Flag comments that only describe what code does (e.g., `# Loop through items`) rather than why.
        Suggest removing these and using better naming or method extraction instead.
      1. Ensure no sensitive data (API keys, tokens, credentials, PII) is logged or included in error responses.
      1. Verify structured logging uses `structlog` with bound context rather than plain `print` or `logging`:
        - Use `structlog.stdlib.get_logger("component").bind(key=value)` pattern.
        - Ensure log messages include relevant context fields (e.g., `request_id`, `user_id`).
      1. Ensure `async`/`await` is used consistently for I/O-bound operations.
      1. Flag any use of `time.sleep()` in async code — use `asyncio.sleep()` instead.
      1. Verify exception handling is specific (avoid bare `except:` or `except Exception:` without re-raising or logging).
      1. Ensure no mutable default arguments in function signatures (e.g., `def f(x=[])` is a bug).
      1. Module-level constants that are not part of the public API should be prefixed with `_` to signal
        they are internal. Flag constants that are only used within the same module but lack the `_` prefix.

  - name: Removing unused code
    fileFilters:
      - "**/*.py"
      - "!tests/**/*"
    instructions: |
      1. When reviewing a removal, confirm nothing else still references the removed symbols or config files
        (for example YAML configs loaded by path), and that helpers still used elsewhere are kept.
        Also check that exports and docstrings in `__init__.py` are updated to match what remains.

  - name: Clean Architecture Layer Separation
    fileFilters:
      - "duo_workflow_service/workflows/**/*.py"
      - "duo_workflow_service/components/**/*.py"
      - "duo_workflow_service/agents/**/*.py"
      - "!duo_workflow_service/agent_platform/**/*"
      - "!tests/**/*"
    instructions: |
      This service enforces strict layer separation. Verify the following:
      1. LangGraph APIs Layer (`duo_workflow_service/` root modules): Only uses raw LangGraph package APIs.
      1. Components Layer (`duo_workflow_service/components/`, `duo_workflow_service/agent_platform/`):
        - Only imports from the LangGraph APIs layer below it.
        - Must not import from the Workflows layer above it.
      1. Workflows Layer (`duo_workflow_service/workflows/`):
        - Only imports from the Components layer below it.
        - Must not import directly from LangGraph APIs layer.
      1. Flag any cross-layer imports that violate this hierarchy — CI enforces this via static scanning.
      1. Tools (`duo_workflow_service/tools/`) should be self-contained and not depend on workflow-specific state.
      1. Agents (`duo_workflow_service/agents/`) should orchestrate via the components layer, not call LangGraph directly.

  - name: Flow Registry contribution guidelines
    fileFilters:
      - "duo_workflow_service/agent_platform/**/*"
      - "tests/duo_workflow_service/agent_platform/**/*"
    instructions: |
      This module implements an internal framework called Flow Registry, before making any suggestions familiarize
      yourself with the latest version of following documents:
      1. Flow Registry documentation at
      https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/raw/main/docs/flow_registry/index.md
      to understand architecture, conventions, and application of Flow Registry
      2. Flow Registry contribution guidelines at docs/flow_registry/contribution_guidelines.md

      CRITICAL: All changes that affect Flow Registry codebase MUST adheres to the contribution guidelines rules.

  - name: No breaking changes within Flow Registry v1 release
    fileFilters:
      - "duo_workflow_service/agent_platform/v1/**/*.py"
      - "!tests/**/*"
    instructions: |
      This module implements a stable release of Flow Registry framework, before making any suggestions
      familiarize yourself with documentation for the stable release at docs/flow_registry/v1.md

      CRITICAL: Any breaking change to components API MUST NOT be introduced under any circumstances.

  - name: Flow Registry experimental release contribution guidelines
    fileFilters:
      - "duo_workflow_service/agent_platform/experimental/**/*.py"
      - "!tests/**/*"
    instructions: |
      This module implements an experimental release of Flow Registry framework, before making any suggestions
      familiarize yourself with documentation for the stable release at docs/flow_registry/experimental.md

      1. Code in this module is intended to be a short lived, changes after being evaluated and validated should be
      either matured to a current stable release, or removed.
      1. This module should import common code from a current stable release module.

  - name: Flow config shape
    fileFilters:
      - "duo_workflow_service/agent_platform/*/flows/configs/**/*.yml"
    instructions: |
      These files are flow definitions, not framework code. Review the shape, not only the syntax.
      Complexity has to be justified here; a single agent node is the baseline.
      1. Reuse: could an existing flow do this with a different goal? `developer` is a general-purpose
        coding agent and absorbs many requests. If a new flow is right, the MR should say why.
      1. Structure: for every component past the first, ask what the split buys. Valid reasons are a
        context-compression boundary, a genuinely different toolset per stage, a human decision point,
        a durable pause and resume, or a hard cost or determinism target. "Cleaner separation" and
        "each node does one thing" are not reasons.
      1. Agency: flag an `AgentComponent` whose work is a fixed action that must always happen — a
        `DeterministicStepComponent` running the known tool call is cheaper and cannot decline. Flag
        arithmetic or fixed rules encoded in a prompt for the same reason. A component that only
        reasons and returns a structured answer is correctly an `AgentComponent` with `toolset: []`.
      1. Prompts: flag step-by-step scripts, enumerated edge cases and incident post-mortems baked
        into a prompt. Persona, priorities and what good looks like age better and cost fewer tokens
        every turn. Flag instructions that teach the model things it already knows, or that restate
        which tools exist.
      1. Reusability: prefer the design that stays useful with a different goal. Specifics belong in
        the goal and the inputs rather than baked into the persona.

  - name: Duo Developer design principles
    fileFilters:
      - "ai/features/code/developer/**/*"
      - "ai/features/code/developer_agent_prompt/**/*"
      - "ai/features/code/local_code_review/**/*"
    instructions: |
      These files define Duo Developer, a shared general-purpose coding agent used by
      many surfaces (mentions, assignments, CLI, Slack). Changes have platform-wide
      blast radius. Before reviewing, read
      ai/features/code/developer/config/PRINCIPLES.md
      in the checked-out repository and review against it. In particular, flag:
      1. Use-case-specific content added to the shared system prompt or flow config —
        that belongs in the client's goal, not in the shared building block.
      1. Procedural instructions (step-by-step scripts, per-incident rules) added to
        prompts — the prompt states principles and priorities.
      1. New flow versions created for a use case rather than for compatibility.
      1. Changes without evidence: the MR should link a session trace pointing at the
        exact failing step, or a baseline-vs-variant eval run for bigger changes.

  - name: LangGraph checkpointer integration
    fileFilters:
      - "duo_workflow_service/checkpointer/**/*.py"
      - "!tests/**/*"
    instructions: |
      The checkpointer sits on LangGraph's saver interface, and LangGraph upgrades can change anything
      outside its documented surface. Verify:
      1. Special channel names such as `__interrupt__` and `__error__` are imported from
        `langgraph.checkpoint.base` (e.g. `INTERRUPT`, `ERROR`), not redeclared as string literals or
        local constants. Why: a local copy keeps compiling after LangGraph renames the channel, and the
        saver silently stops matching.
      1. Flag hand-maintained lists of LangGraph's internal control channels, and helpers that infer a task's
        state from which channels it wrote. Suggest a rule based on the few public names the code needs.
        Why: such lists go stale on upgrade, and each one is more internal behaviour to re-verify.
      1. When the code relies on an undocumented property of what LangGraph hands the saver (the order of
        writes in a batch, which write comes first), it must say so in a comment and a test must pin it.
        Why: an upgrade that changes the property otherwise breaks stored checkpoints with no failing test.

  - name: In-process caches
    fileFilters:
      - "**/*.py"
      - "!tests/**/*"
    instructions: |
      For a new process-wide cache (`functools.lru_cache`, `cache`, a module-level dict or an LRU class), verify:
      1. Where do the keys come from? If any key can be derived from client input (an inline flow config, a prompt,
        a request body), the cache must be bounded by the bytes it holds, not by its number of entries. Why: an
        entry-count limit such as `maxsize=1024` still allows 1024 entries of several MiB each, and the memory can
        stay held after `cache_clear()`.
      1. Weigh the whole entry (key and cached value), not only the key length. Why: the value can weigh many times
        its key, and a character count is not a byte count (CPython stores 1, 2 or 4 bytes per character).
      1. Entries that are too large to keep must be returned to the caller but not stored. Apply the size check where
        the entry is stored, including on validation paths that run before an input is rejected. Why: otherwise inputs
        that are rejected anyway still fill the cache with unused entries.
      1. Keys must not include text that differs per session or per request (rendered output, usernames, random
        suffixes). Why: every such call adds an entry that is never hit again and evicts useful ones.
      1. Callers must get a copy of a mutable cached value, or the cache must hold an immutable one.
      1. An `autouse` fixture must reset the cache between tests, in a `conftest.py` that every test of the cached code
        can see. Use the root `conftest.py` when tests outside `tests/` use it, such as feature tests in
        `ai/features/<domain>/<feature>/tests/`. The same applies to a module-level registry or singleton. Why: the
        suite runs in random order with xdist, so a test that reuses a key with different mocks passes or fails by
        order.
      1. A test must fail when the bound is removed: one test at the limit and one just over it. For nested input,
        test a multi-level case (for example includes of includes), not only one level. Why: an unbounded cache or a
        one-level recursion can pass the whole suite unnoticed.

  - name: Dependency Injection
    fileFilters:
      - "**/*.py"
      - "!tests/**/*"
    instructions: |
      This project uses the Dependency Injector framework. Verify:
      1. If a resource is provided in a container, avoid instantiating it directly — use the container instead.
      1. Container definitions should use `providers.Singleton` for stateless services and `providers.Factory`
        for objects that need fresh instances per request.
      1. Verify that a new container is nested in `ai/platform/container.py` when both apps use it, or in
        `ai/apps/<app>/container.py` when one app uses it. New providers do not go in `ai_gateway/container.py`.

  - name: FastAPI Endpoints
    fileFilters:
      - "ai/apps/aigw/**/*.py"
      - "ai_gateway/api/**/*.py"
      - "!tests/**/*"
    instructions: |
      For FastAPI endpoint changes, verify:
      1. Request and response models use Pydantic v2 models with explicit field types and validators.
      1. Endpoints use dependency injection via `Depends()` for shared resources (auth, DB, etc.).
      1. Authentication middleware is applied — new endpoints must not bypass auth without explicit justification.
      1. HTTP status codes are appropriate and consistent with REST conventions.
      1. Error responses use the project's `error_utils.py` patterns and do not leak internal details.
      1. New endpoints are versioned under the correct `v{1,2,3,4}/` directory.
      1. Ensure `feature_category` is set correctly for new endpoints (see `ai_gateway/api/feature_category.py`).
      1. Streaming endpoints use `StreamingResponse` with proper content-type headers.
      1. Verify that new routes are registered in the appropriate router and included in `ai/apps/aigw/server.py`.

  - name: Pydantic Models and Configuration
    fileFilters:
      - "ai_gateway/config.py"
      - "**/models/**/*.py"
      - "!tests/**/*"
    instructions: |
      For Pydantic model and configuration changes, verify:
      1. Use Pydantic v2 syntax (`model_validator`, `field_validator`) — not deprecated v1 validators.
      1. Configuration classes inherit from `BaseSettings` with `AIGW_` prefix for environment variables.
      1. Nested config uses double underscore separator: `AIGW_SECTION__SUBSECTION__KEY`.
      1. Sensitive fields (API keys, tokens) use `SecretStr` type to prevent accidental logging.
      1. New config fields have sensible defaults and are documented with `Field(description=...)`.
      1. Avoid breaking changes to existing config field names — prefer adding new fields with defaults.

  - name: LLM Model Integration
    fileFilters:
      - "ai_gateway/models/**/*.py"
      - "ai_gateway/model_selection/**/*.py"
      - "!tests/**/*"
    instructions: |
      For LLM model integration changes, verify:
      1. New models are registered in `ai_gateway/model_selection/models.yml` with correct metadata.
      1. Metadata in `ai_gateway/model_selection/models.yml` should have `params.model` using a pinned or snapshot model version (date format or version ID) rather than a provider alias.
      1. LiteLLM is used as the unified interface for multi-provider support where applicable.
      1. Token limits and context window sizes are correctly configured for new models.
      1. Streaming and non-streaming response paths are both handled.
      1. Error handling covers rate limits, timeouts, and provider-specific errors.

  - name: No breaking changes to prompt templates syntax
    fileFilters:
      - "ai_gateway/prompts/config/base.py"
      - "!tests/**/*"
    instructions: |
      The public API of this project includes prompt templates (via Flow Registry and AI Catalog),
      therefore according to GitLab backward support policy no breaking changes are allowed.

      Breaking changes include removal of any public model attributes, or any change that makes
      a public optional model attribute required

      CRITICAL: Any breaking change to prompt template syntax nor structure MUST NOT be introduced under any circumstances.

  - name: Prompt Templates
    fileFilters:
      - "ai_gateway/prompts/**/*.jinja"
      - "ai_gateway/prompts/**/*.yml"
    instructions: |
      For prompt template changes, verify:
      1. Sensitive data is not hardcoded in prompt templates.
      1. When a template extends a base template or includes shared partials, check the fully rendered prompt
        for two instructions on the same topic that disagree or both claim to be preferred (for example two
        different branch-name formats). Suggest aligning the new text with the shared format, or stating that it
        replaces the base text when the base has no block to override.
        Why: the model has to guess which instruction wins, and the result differs between runs.

  - name: Authentication and Security
    fileFilters:
      - "ai/apps/aigw/server.py"
      - "ai_gateway/auth/**/*.py"
      - "ai_gateway/api/middleware/**/*.py"
      - "!tests/**/*"
    instructions: |
      For authentication and security changes, verify:
      1. JWT validation logic is not weakened — flag any changes to signature verification.
      1. `bypass_external` and `bypass_jwt_signature` config flags must only be used in local dev/test.
      1. New middleware must be applied in the correct order in `ai/apps/aigw/server.py`.
      1. Authorization checks must happen before any business logic or data access.
      1. Ensure no credentials, tokens, or secrets are logged at any log level.
      1. Cloud Connector JWT claims are validated against expected values.
      1. Self-hosted instance authentication paths are tested separately from SaaS paths.

  - name: Duo Workflow Tools — File Access Security
    fileFilters:
      - "duo_workflow_service/tools/**/*.py"
      - "!tests/**/*"
    instructions: |
      Any tool that reads files from the executor must apply the full two-layer access check,
      matching what `ReadFile` and `ReadFileChunked` enforce. Verify:
      1. Every file-read path calls `validate_duo_context_exclusions(path)` (the always-on hardcoded
        denylist covering `.ssh`, `.env*`, `.git`, path-traversal sequences, etc.) before issuing
        `runReadFile`. Relying only on the optional project-level `FileExclusionPolicy` is not
        sufficient — when a project has no `exclusion_rules`, that check unconditionally returns `True`.
      1. The same two-layer check must be applied to any path recovered by path-repair or glob-expansion
        logic, not just the originally-supplied path.
      1. Flag any new tool that reads a file path derived from LLM output (findings, model-controlled
        fields) without both checks — even if the read content is not echoed verbatim in the output,
        the read itself crosses the security boundary.

  - name: Duo Workflow Tools — Input Schema Validation
    fileFilters:
      - "duo_workflow_service/tools/**/*.py"
      - "!tests/**/*"
    instructions: |
      For new or changed tool parameters, verify:
      1. Length, emptiness and character constraints (`min_length`, `max_length`, `ge`/`le`, a
        `field_validator`) live on the Pydantic `args_schema` field, not only in `_execute`.
        Why: `format_display_message` and other callers are built from the parsed schema, so a check
        that exists only in `_execute` leaves them handling unvalidated model-written text.
      1. If `_execute` repeats a constraint as defence in depth, a test should assert that the schema
        rejects the same values (e.g. `pytest.raises(ValidationError)` on the input model).

  - name: Duo Workflow Tools — Git History on Shallow Clones
    fileFilters:
      - "duo_workflow_service/tools/git_history.py"
      - "duo_workflow_service/tools/read_only_git.py"
      - "!tests/**/*"
    instructions: |
      CI flows commonly run on depth-limited (shallow) clones, so a git-history tool has to be useful
      there, not only correct on a full clone. Verify:
      1. Behaviour at the graft (boundary) commit is considered. Git diffs a graft against an empty
        tree, so it can match a content search for any string in its tree and list every file in the
        repository. Prefer turning the root diff off for shallow clones (e.g. `log.showRoot=false`)
        over only labelling the commit. Why: on a large repository the graft entry alone can exceed the
        executor's output limit, and a fail-closed truncation then discards the real hits with it.
      1. Any output-size or truncation handling is tested against a real shallow clone whose graft
        commit holds a large tree, not only against hand-built fake `git log` output.
      1. A per-call `-c` setting cannot override a key already pinned in `GIT_GLOBAL_FLAGS`
        (compare case-insensitively, since git honours the last spelling).

  - name: Duo Workflow Tools — untrusted git and prose output
    fileFilters:
      - "duo_workflow_service/tools/**/*.py"
      - "duo_workflow_service/security/prompt_security.py"
      - "!tests/**/*"
    instructions: |
      Tools that return git data or contributor-authored text hand attacker-controlled content to the model.
      Verify:
      1. When a tool gets an entry in `TOOL_SECURITY_OVERRIDES` that drops a sanitiser (for example
        `strip_hidden_html_comments` so a patch keeps its code comments), check that prose fields in the same
        output (commit subject and body, descriptions, titles) are still sanitised in the tool itself before
        rendering. Why: the override applies to the whole response, so hidden text in prose would otherwise
        reach the model unfiltered.
      1. When a tool accepts a full or abbreviated commit SHA and resolves it with git (`rev-parse`, `show`),
        verify the resolved SHA starts with the value the caller passed, or refuse. Why: git tries ref names
        before abbreviated hashes, so a tag or branch named after a SHA prefix can make the tool answer with a
        different commit.
      1. Flag a tool description, error or omission hint that tells the model to retry with a narrowing
        parameter (such as `path`) in a case where that parameter cannot change the outcome. Why: the model
        keeps repeating the same failing call. Say what to do instead.

  - name: gRPC and Protocol Buffers
    fileFilters:
      - "contract/**/*.proto"
      - "duo_workflow_service/**/*_pb2*.py"
      - "!tests/**/*"
    instructions: |
      For gRPC and protobuf changes, verify:
      1. Proto changes are backward-compatible (no field removal, no field number reuse).
      1. Generated files (`*_pb2.py`, `contract_pb.rb`, etc) are regenerated via `make gen-proto`.
      1. New RPC methods have corresponding server-side implementations.
      1. Streaming RPCs handle client disconnection and cancellation gracefully.
      1. Proto field names use `snake_case` as per protobuf conventions.
      1. Comments on messages, fields and enum values ship in the generated Go and Node clients (and in
        `contract.proto` itself), so each behavioural claim (e.g. "the service records it", "never promotes") must
        be true of the server code. Check the claim against the code path and its log level, and flag wording that
        over-promises. Why: client authors read these comments as the contract, and a false claim is hard to
        correct once clients are released.

  - name: Internal Events Tracking
    fileFilters:
      - "config/events/**/*.yml"
      - "lib/internal_events/**/*.py"
      - "ai_gateway/**/*.py"
      - "!tests/**/*"
    instructions: |
      For internal event tracking changes, verify:
      1. Event definitions exist in `config/events/*.yml` for any new `track_internal_event` calls.
      1. Event `action` names follow the convention: `<operation>_<target>_<where/when>`.
      1. Required fields are present in event definitions: `description`, `action`, `product_group`, `tiers`.
      1. No PII, secrets, or sensitive data is included in event properties.
      1. The `InternalEventEnum` in `lib/internal_events/event_enum.py` is updated for new events.
      1. Events are only tracked after successful operations, not on failures (unless explicitly tracking errors).

  - name: Test Coverage
    fileFilters:
      - "tests/**/*.py"
    instructions: |
      1. Test files mirror source structure: `tests/path/to/test_module.py` for `path/to/module.py`.
      1. Use pytest fixtures and @pytest.mark.parametrize for reducing duplication.
      1. Ensure error handling paths are tested, not just the happy path.
      1. For conditional logic (`if`/`else`, `try`/`except`), verify each branch has test coverage.
      1. Flag missing edge case coverage:
        - `None`/empty values
        - Boundary conditions
        - Error states and exception propagation
      1. Async tests must use `pytest-asyncio` with `@pytest.mark.asyncio` decorator — do not call `asyncio.run()` inside test bodies.
      1. Mock external dependencies (LLM providers, GCP, GitLab API) — do not make real network calls in unit tests.
      1. Use `unittest.mock.patch` (or `patch.object`) for mocking rather than manual monkeypatching:
        - Use `return_value=` for fixed return values, `side_effect=` for exceptions or computed results.
        - Use `new_callable=AsyncMock` for async callables.
        - Prefer `assert_called_once_with(...)` / `assert_not_called()` over manual flag variables.
      1. Integration tests in `integration_tests/` may make real calls but must be clearly marked.
      1. Follow the testing pyramid: most tests at unit level, fewer at integration/system level.
      1. Verify that new fixtures in `conftest.py` are scoped appropriately (`function`, `module`, `session`).
      1. Tests for streaming endpoints (`StreamingResponse`) must assert on the streamed body or events, not only
        on `response.status_code`. Why: the status line is sent before the work runs, so it is `200` even when the
        agent or model fails mid-stream, and a status-only assertion passes while the feature is broken.
      1. Flag a single test that checks several behaviours by branching on a parameter (e.g. `if expected_status == 422:`
        inside the test body). Suggest splitting it into separate tests, each with its own unconditional assertions.
        Why: branching hides which behaviour failed and lets one branch go unasserted.
      1. Flag a new test that repeats an existing one: its only distinguishing input does not affect the branch it
        claims to cover, and an existing test already pins that branch (e.g. the test changes how one condition is
        set, but a separate guard decides the outcome whatever that condition is). Suggest dropping it or adding it
        as a row to an existing parametrized test. Why: duplicate tests add maintenance cost without catching new
        regressions.

  - name: Documentation
    fileFilters:
      - "docs/**/*.md"
      - "README.md"
      - "AGENTS.md"
    instructions: |
      1. Ensure new or updated content aligns with existing content in technical meaning and style.
      1. Use American English spelling and active voice.
      1. Avoid excessive or repetitive links.
      1. Avoid ambiguous phrases and be consistent with feature names.
      1. Avoid sales or marketing language, including words like "easily" or "simply."
      1. Get straight to the point — avoid phrases like "This page shows."
      1. Use sentence case for topic titles.
      1. Do not promise work in future milestones. Instead, say work is being proposed.
      1. Code examples in docs must be tested and accurate.
      1. Shell commands should be copy-pasteable and include all required context.
      1. AGENTS.md changes must accurately reflect the current state of the repository conventions.

  - name: CI/CD Configuration
    fileFilters:
      - ".gitlab-ci.yml"
      - ".gitlab/ci/**/*.yml"
    instructions: |
      For CI/CD configuration changes, verify:
      1. New jobs are placed in the appropriate stage and file under `.gitlab/ci/`.
      1. Jobs that run on MRs use `rules: - if: $CI_PIPELINE_SOURCE == "merge_request_event"` or equivalent.
      1. Secrets and credentials must never be hardcoded. Reference them through the Runway Vault as the preferred path
      or CI/CD variables depending on the deployment context.
      1. New Docker images used in jobs are pinned to a specific digest or version tag.
      1. Jobs that modify deployment configuration are reviewed by a maintainer.
      1. Ensure `needs:` dependencies are correct to avoid unnecessary pipeline delays.
      1. When a MR removes a `needs:` edge or otherwise lets a downstream job (especially a prod or
        production-like job) run without waiting for an upstream one, ask what the upstream job protected
        implicitly (for example, dev acting as a canary that stopped prod when it failed). If the downstream job
        can now fail in a way that leaves harmful partial state, the MR must handle that failure itself or say
        why it is safe. Why: the ordering was a safety gate nobody wrote down, and removing it moves the risk
        into the downstream job.

  - name: Multi-step provisioning and ingest scripts
    fileFilters:
      - "scripts/**/*.py"
    instructions: |
      For scripts that create an external resource and then populate or configure it in a later step
      (for example create a data store, then import documents), verify:
      1. If the later step fails, what is left behind? Flag a half-provisioned resource (such as an empty data
        store) that consumers could treat as valid. Why: an empty resource can change consumer behaviour worse
        than a missing one, for example by suppressing a fallback that only triggers on `NOT_FOUND`.
      1. Any cleanup after failure must delete only what the same run created, never a resource that existed
        before, and must re-raise the original error so the job still fails.
      1. Cleanup logic that deletes in a production environment must have unit tests for the three cases:
        newly created and succeeded (kept), newly created and failed (deleted), already existing and failed (kept).

  - name: Dependency Management
    fileFilters:
      - "pyproject.toml"
      - "poetry.lock"
    instructions: |
      For dependency changes, verify:
      1. New dependencies are added to the correct group (`main`, `test`, `lint`).
      1. Version constraints use `^` (compatible release) unless a specific version is required.
      1. Security-sensitive dependencies (auth, crypto) are pinned more tightly.
      1. The `poetry.lock` file is updated and committed alongside `pyproject.toml` changes.
      1. New dependencies do not introduce conflicting transitive dependencies.
      1. Prefer well-maintained packages with active communities over abandoned ones.
      1. Check for known vulnerabilities in new dependencies.
      1. Dependencies should not bloat the application code or prolong CI times unnecessarily.
