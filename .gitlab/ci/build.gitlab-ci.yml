# Canonical v1.x tags retag the image main already built, so they skip the build.
# Job rules rather than skipping this include, because release jobs still `needs`
# the self-hosted build jobs defined here.
.skip-on-version-tag-rules: &skip-on-version-tag-rules
  - if: $CI_PROJECT_ID == $CANONICAL_PROJECT_ID && $CI_COMMIT_TAG =~ /^v\d/
    when: never
  - when: on_success

install:
  extends: .poetry
  stage: build
  rules: *skip-on-version-tag-rules
  cache:
    policy: push
  script:
    - poetry install --with lint,test

.docker-build-arch:
  extends:
    - .docker
  parallel:
    matrix:
      - ARCH: amd64
        RUNNER: saas-linux-medium-amd64
      - ARCH: arm64
        RUNNER: saas-linux-medium-arm64
  tags:
    - $RUNNER
  script:
    - docker buildx build
        --file "${BUILD_FILE:-Dockerfile}"
        --tag "${BUILD_TAG}-${ARCH}"
        ${BUILD_EXTRA_ARGS}
        --push
        .

.docker-manifest:
  extends:
    - .docker
  script:
    - docker manifest create ${MANIFEST_TAG}
        ${MANIFEST_TAG}-amd64
        ${MANIFEST_TAG}-arm64
    - docker manifest push ${MANIFEST_TAG}

build-docker-model-gateway-arch:
  stage: build
  extends:
    - .docker-build-arch
  rules: *skip-on-version-tag-rules
  variables:
    BUILD_TAG: "${TARGET_IMAGE}"
    BUILD_EXTRA_ARGS: "--build-arg GITLAB_API_TOKEN=$GITLAB_API_TOKEN"

build-docker-model-gateway:
  stage: build
  extends:
    - .docker-manifest
  rules: *skip-on-version-tag-rules
  variables:
    MANIFEST_TAG: "${TARGET_IMAGE}"
  needs:
    - build-docker-model-gateway-arch
  script:
    - !reference [.docker-manifest, script]
    # Hand the digest to sign:model-gateway as a file, not a variable, which a
    # manual pipeline variable could override.
    - docker buildx imagetools inspect "${TARGET_IMAGE}" --format '{{json .Manifest.Digest}}' | tr -d '"' > image-digest
  artifacts:
    paths:
      - image-digest

# Signs the digest above so release-docker-image:version-tag can verify v1.x retags.
# Canonical only: the security fork must not write to the public Rekor log.
sign:model-gateway:
  stage: build
  extends:
    - .docker
  needs:
    - job: build-docker-model-gateway
      artifacts: true  # image-digest, the digest that job pushed
  retry: 2
  id_tokens:
    SIGSTORE_ID_TOKEN:  # Minted per job by GitLab, no CI/CD variable needed
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  script:
    - apk add --no-cache cosign
    # Sign the digest, not the tag, and bind the commit so an older signed
    # image cannot be moved to this commit's tag.
    - cosign sign --annotations "commit-sha=${CI_COMMIT_SHA}" "${DOCKER_MODEL_GATEWAY}@$(cat image-digest)"
    # The check release-docker-image:version-tag runs, so a bad identity or
    # annotation fails this main pipeline instead of the first v1.x tag.
    - cosign verify
        --certificate-oidc-issuer "${CI_SERVER_URL}"
        --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/heads/${CI_DEFAULT_BRANCH}"
        --annotations "commit-sha=${CI_COMMIT_SHA}"
        "${DOCKER_MODEL_GATEWAY}@$(cat image-digest)"
  rules:
    - if: $CI_PROJECT_ID != $CANONICAL_PROJECT_ID
      when: never
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:ingest-image:
  stage: build
  extends:
    - .docker
  script:
    - docker buildx build
        --file scripts/ingest/Dockerfile
        --tag "${INGEST_IMAGE}"
        --push
        .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scripts/ingest/**/*
        - Makefile
        - poetry.lock
        - pyproject.toml
        - .tool-versions
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE == "ingest"

build:self-hosted-ai-gateway-image-arch:
  stage: build
  extends:
    - .docker-build-arch
  variables:
    BUILD_FILE: docker/self_hosted/Dockerfile
    BUILD_TAG: "${TARGET_IMAGE}"
    BUILD_EXTRA_ARGS: "--build-arg TAG=$CI_COMMIT_TAG --build-arg SRC_IMAGE=${TARGET_IMAGE}-${ARCH}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/
  needs:
    - build-docker-model-gateway

build:self-hosted-ai-gateway-image:
  stage: build
  extends:
    - .docker-manifest
  variables:
    MANIFEST_TAG: "${TARGET_IMAGE}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/
  needs:
    - build:self-hosted-ai-gateway-image-arch

build:self-hosted-ai-gateway-latest-image-arch:
  stage: build
  extends:
    - .docker-build-arch
  variables:
    BUILD_FILE: docker/self_hosted/Dockerfile
    BUILD_TAG: "${SELF_HOSTED_TARGET_IMAGE}"
    BUILD_EXTRA_ARGS: "--build-arg TAG=master --build-arg SRC_IMAGE=${TARGET_IMAGE}-${ARCH}"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build-docker-model-gateway

build:self-hosted-ai-gateway-latest-image:
  stage: build
  extends:
    - .docker-manifest
  variables:
    MANIFEST_TAG: "${SELF_HOSTED_TARGET_IMAGE}"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:self-hosted-ai-gateway-latest-image-arch

# FIPS builds use buildx for --build-context support.
.build-fips-base-image-arch:
  stage: build
  extends:
    - .docker-build-arch
  variables:
    BUILD_FILE: docker/fips/Dockerfile
    BUILD_TAG: "${FIPS_TARGET_IMAGE}"
    BUILD_EXTRA_ARGS: "--build-arg GITLAB_API_TOKEN=$GITLAB_API_TOKEN --build-context hardening=https://gitlab.com/gitlab-org/build/CNG.git#v18.3.5:hardening"

build:ai-gateway-fips-base-image-arch:
  extends: .build-fips-base-image-arch
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/

build:ai-gateway-fips-base-image-nightly-arch:
  extends: .build-fips-base-image-arch
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.build-fips-base-image:
  stage: build
  extends:
    - .docker-manifest
  variables:
    MANIFEST_TAG: "${FIPS_TARGET_IMAGE}"

build:ai-gateway-fips-base-image:
  extends: .build-fips-base-image
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/
  needs:
    - build:ai-gateway-fips-base-image-arch

build:ai-gateway-fips-base-image-nightly:
  extends: .build-fips-base-image
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:ai-gateway-fips-base-image-nightly-arch

.build-self-hosted-fips-base-image-arch:
  stage: build
  extends:
    - .docker-build-arch
  variables:
    BUILD_FILE: docker/self_hosted/Dockerfile.fips
    BUILD_TAG: "${SELF_HOSTED_FIPS_TARGET_IMAGE}"
    BUILD_EXTRA_ARGS: "--build-arg TAG=${FIPS_TAG} --build-arg SRC_IMAGE=${FIPS_TARGET_IMAGE}-${ARCH}"

build:self-hosted-ai-gateway-fips-image-arch:
  extends: .build-self-hosted-fips-base-image-arch
  variables:
    FIPS_TAG: "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/
  needs:
    - build:ai-gateway-fips-base-image-arch

build:self-hosted-ai-gateway-fips-image-nightly-arch:
  extends: .build-self-hosted-fips-base-image-arch
  variables:
    FIPS_TAG: "master"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:ai-gateway-fips-base-image-nightly-arch

.build-self-hosted-fips-base-image:
  stage: build
  extends:
    - .docker-manifest
  variables:
    MANIFEST_TAG: "${SELF_HOSTED_FIPS_TARGET_IMAGE}"

build:self-hosted-ai-gateway-fips-image:
  extends: .build-self-hosted-fips-base-image
  variables:
    FIPS_TAG: "$CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG =~ /^self-hosted-/
  needs:
    - build:self-hosted-ai-gateway-fips-image-arch

build:self-hosted-ai-gateway-fips-image-nightly:
  extends: .build-self-hosted-fips-base-image
  variables:
    FIPS_TAG: "master"
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:self-hosted-ai-gateway-fips-image-nightly-arch
