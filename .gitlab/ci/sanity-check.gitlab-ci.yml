# Child pipeline for the SWE-bench sanity check (CEF eval).
#
# Started fire-and-forget by the `sanity-check-trigger` job in
# .gitlab/ci/test.gitlab-ci.yml: the trigger job succeeds as soon as this
# pipeline starts, so a failure here never blocks or delays the parent
# MR/branch pipeline. The result shows up as a downstream pipeline.
#
# SANITY_CHECK_EVAL_SHA and PARENT_PIPELINE_ID are forwarded by the trigger
# job because CI_MERGE_REQUEST_* variables are not available here.
#
# The eval takes 20-35 min. For most of that time, CEF sets up a VM. So that
# no runner waits for it, the work is in two jobs:
# - `sanity-tests:register` registers the eval and ends in a few seconds.
# - `sanity-tests` starts 20 min later and polls until the eval ends.
# In 14 days, no successful eval ended in less than 20 min.

.sanity-tests-base:
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}alpine:3.24
  stage: test
  rules:
    # Required: without rules the implicit `only: branches/tags` default
    # applies, which never matches the merge request ref this child pipeline
    # runs on, so the downstream pipeline creation fails with no jobs.
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.gitlab.net
  secrets:
    # Pinned to the canonical project's shared path rather than built from
    # ${VAULT_SECRETS_PATH}/${VAULT_SECRETS_SHARED_PATH}: those are derived from
    # CI_PROJECT_PATH, so in the security mirror they resolve under
    # gitlab-com/gitlab-org/security/... and the secret does not exist there.
    CEF_SERVICE_ACCOUNT_PAT:
      file: false
      vault: gitlab-com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/shared/cef-service-account/personal_access_token@ci
      token: $VAULT_ID_TOKEN
  variables:
    CEF_SERVICE_URL: "https://cef.runway.gitlab.net"
  before_script:
    - apk add --no-cache curl jq

sanity-tests:register:
  extends: .sanity-tests-base
  artifacts:
    reports:
      # Gives CEF_REQUEST_ID to `sanity-tests`.
      dotenv: cef_eval.env
  script:
    - |
      ./scripts/submit_cef_eval.sh register \
        "${SANITY_CHECK_EVAL_SHA:-$CI_COMMIT_SHA}" \
        "$CI_PROJECT_PATH" \
        "AIGW sanity-tests CI: pipeline $CI_PIPELINE_ID (parent pipeline: ${PARENT_PIPELINE_ID:-none})"

sanity-tests:
  extends: .sanity-tests-base
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
      when: delayed
      start_in: 20 minutes
  # Does not run when the registration fails.
  needs:
    - job: sanity-tests:register
      artifacts: true
  variables:
    CEF_POLL_INTERVAL: "60"
    # Counted from the start of this job. Less than the 1 h job timeout, so
    # the job prints the last state before the runner stops it.
    CEF_POLL_TIMEOUT: "3300"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cef_eval_state.json
  script:
    - ./scripts/submit_cef_eval.sh wait
