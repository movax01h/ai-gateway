# Child pipeline for the SWE-bench sanity check (CEF eval).
#
# Started fire-and-forget by the `sanity-check-trigger` job in
# .gitlab/ci/test.gitlab-ci.yml: the trigger job succeeds as soon as this
# pipeline starts, so a failure here never blocks or delays the parent
# MR/branch pipeline. The result shows up as a downstream pipeline.
#
# SANITY_CHECK_EVAL_SHA and PARENT_PIPELINE_ID are forwarded by the trigger
# job because CI_MERGE_REQUEST_* variables are not available here.

sanity-tests:
  image: ${GITLAB_DEPENDENCY_PROXY_ADDRESS}alpine:3.24
  stage: test
  rules:
    # Required: without rules the implicit `only: branches/tags` default
    # applies, which never matches the merge request ref this child pipeline
    # runs on, so the downstream pipeline creation fails with no jobs.
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"
  id_tokens:
    VAULT_ID_TOKEN:
      aud: https://vault.gitlab.net
  secrets:
    CEF_SERVICE_ACCOUNT_PAT:
      file: false
      vault: ${VAULT_SECRETS_PATH}/${VAULT_SECRETS_SHARED_PATH}/cef-service-account/personal_access_token@ci
      token: $VAULT_ID_TOKEN
  variables:
    CEF_SERVICE_URL: "https://cef.runway.gitlab.net"
    CEF_POLL_INTERVAL: "60"
    CEF_POLL_TIMEOUT: "5400"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - cef_eval_state.json
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      ./scripts/submit_cef_eval.sh \
        "${SANITY_CHECK_EVAL_SHA:-$CI_COMMIT_SHA}" \
        "$CI_PROJECT_PATH" \
        "AIGW sanity-tests CI: pipeline $CI_PIPELINE_ID (parent pipeline: ${PARENT_PIPELINE_ID:-none})"
