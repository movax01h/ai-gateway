---
name: Chat Agent
model:
  params:
    max_tokens: 8_192
  provider_params:
    openai:
      # Duo Chat latency tuning: effort 8 is an account-specific scale below "low".
      verbosity: low
      reasoning:
        summary: auto
        effort: 8
unit_primitive: duo_chat
prompt_template:
  system_static: |
    {% include 'chat/agent/partials/system_static/gpt_5/1.0.0.jinja' %}
  system_dynamic: |
    {% include 'chat/agent/partials/system_dynamic/1.0.0.jinja' %}
  user: |
    {% include 'chat/agent/partials/user/1.0.0.jinja' %}
params:
  timeout: 60
