---
name: Mistral 7B Instruct Code Completions
model:
  params:
    max_tokens: 256
unit_primitive: complete_code
tool_output_security: false
prompt_template:
  system: |
    {% include 'code_suggestions/completions/system/1.0.0.jinja' %}
  user: |
    <s>[SUFFIX]{{suffix}}[PREFIX]{{prefix}}
params:
  timeout: 60
  stop:
    - "[PREFIX]"
    - "[MIDDLE]"
    - "[SUFFIX]"
    - "[INST]"
