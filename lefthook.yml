pre-commit:
  # Parallel script execution is disabled to prevent race conditions
  # when installing dependencies. Multiple scripts trying to modify
  # the same Python packages simultaneously can corrupt the environment.
  # See: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/3160
  parallel: false
  skip:
    - ref: main
  commands:
    lint-python:
      glob: "*.py"
      run: |
        # Filter out auto-generated protobuf files that cannot be linted
        export STAGED_FILES="$(echo '{staged_files}' | tr ' ' '\n' | grep -v 'contract_pb2\.py' | tr '\n' ' ')"

        make check-mypy LINT_WORKING_DIR="$STAGED_FILES"

        # Run all other parts of lint-code (everything except check-mypy)
        make check-ruff check-pylint check-codespell check-docformatter check-editorconfig \
        LINT_WORKING_DIR="$STAGED_FILES" \
        CODESPELL_LINT_WORKING_DIR="$STAGED_FILES" \
        EDITORCONFIG_LINT_WORKING_DIR="$STAGED_FILES"
    check-duo-workflow-flow-schema:
      glob: "*.py"
      run: |
        if echo '{staged_files}' | tr ' ' '\n' | grep -qE '^(duo_workflow_service/agent_platform/v1/flows/flow_config\.py|duo_workflow_service/schemas/.*|ai_gateway/prompts/config/base\.py|ai_gateway/response_schemas/config\.py)$'; then
          make check-duo-workflow-flow-schema
        fi
    check-legacy-roots:
      run: |
        if echo '{staged_files}' | tr ' ' '\n' | grep -qE '^(ai_gateway/prompts/definitions/|duo_workflow_service/agent_platform/v1/flows/configs/)|^scripts/(check_legacy_roots\.py|legacy_roots_allowlist\.txt)$'; then
          make check-legacy-roots LEGACY_ROOTS_BASE=origin/main
        fi
    lint-graphql:
      glob: "*.graphql"
      run: make check-graphql
    lint-yaml:
      glob: "*.{yml,yaml}"
      run: |
        export STAGED_FILES="$(echo '{staged_files}')"
        make check-yamllint YAMLLINT_WORKING_DIR="$STAGED_FILES"
    lint-other:
      exclude:
        - "*.py"
      run: |
        export STAGED_FILES="$(echo '{staged_files}')"
        make check-codespell CODESPELL_LINT_WORKING_DIR="$STAGED_FILES"
        make check-editorconfig EDITORCONFIG_LINT_WORKING_DIR="$STAGED_FILES"
    lint-proto:
      glob: "contract/*.proto"
      run: make lint-proto
    lint-doc:
      glob: "*.md"
      run: make lint-doc
pre-push:
  commands:
    lint-commit:
      run: make lint-commit
