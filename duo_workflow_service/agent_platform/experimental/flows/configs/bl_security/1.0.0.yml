        A slot left blank or omitted is not a pass — the finding is not emittable until all four carry a citation or the literal token. Write `SEARCHED_NONE_FOUND` only after you have run that search: it records that you looked, so writing it unsearched makes the record false. If any slot yields a guard you read and found to cover this path, the finding is mitigated — DROP it.
        Consequence — the outcome you claim must be one the reacher cannot already obtain legitimately; an escalation to something the same principal gets by asking for it through a supported path describes the product working, not a defect. One line:
        `CHEAPEST_LEGITIMATE_EQUIVALENT: <the cheapest supported route by which the LEAST_PRIVILEGED_REACHER above already obtains the same capability, data or state this finding claims they gain> @ <file:line> | NONE — searched: <where you looked>`
        DROP RULE — if such a route exists, DROP the finding: the outcome costs the reacher nothing they do not already have, so the defect as described has no consequence. Write `NONE` only after looking for one, and name where you looked.
        This section is required and it is where the analysis happens — write it out even when the answer is "nothing here". Put no JSON in it.
        STEP 2 — then call `bl_unit_findings` once, alone, as your last action: `findings` first, the findings STEP 1 cleared through the gates, then a one-to-three sentence `summary`. `findings: []` is a valid answer when it cleared none. Each finding:
        {"file": "<path of the file the finding is in>", "new_line": <absolute line where code_excerpt appears — re-read the file and confirm this line is correct>, "code_excerpt": "<the exact 1-3 line verbatim snippet copied character-for-character from `file` that is the vulnerable statement (the missing/broken check site); it must appear literally in the file so it can be located>", "tier": 1|2|3, "severity": "critical"|"high"|"medium"|"low", "cwe": "CWE-###", "body": "<specific explanation naming the concrete missing or broken control and the reachable call path — no 'if'/'could'/'might' speculation. When the finding is a sibling asymmetry, it must also name the guarded sibling (file:line) and the exact guard it has that this one lacks — that naming is what makes an asymmetry claim checkable, so an asymmetry finding without it is not emittable. For an in-scope finding of any other shape there is no sibling to name and none may be invented to fill this field: a race/TOCTOU cites both sites and what can change between them, a stale-authorization-state cites where the fact is established and where it is consumed, an incorrect guard cites the guard's condition and the reachable input it fails to cover.>", "title": "<under 80 characters, counted: the endpoint or function and the problem in plain words, e.g. DELETE /api/projects/:id lets any signed-in user delete another team's project — no CWE number, no trailing period>", "impact": "<one plain sentence for a customer, under 30 words: who can do what to whom>"}
