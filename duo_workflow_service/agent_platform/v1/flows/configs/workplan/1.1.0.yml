---
version: v1
# `ambient` is required here: FlowConfig restricts this field to
# ("ambient", "chat", "chat-partial"). The monolith's `environment: "web"`
# is a separate concept (run server-side in CI) and every CI-executed
# foundational flow — code_review, fix_pipeline, developer — pairs it with
# `ambient` on this side. `ambient` is also the only environment
# SupervisorAgentComponentV2 supports.
environment: ambient
components:
  - name: research
    type: AgentComponent
    prompt_id: workplan_research_prompt
    response_schema_id: workplan_research_decision
    response_schema_version: "^1.0.0"
    max_cycles: 25
    inputs:
      - from: context:goal
        as: goal
      - from: "research"
        as: stage
        literal: true
    # GitLab-only toolset (READ_ONLY_GITLAB/READ_WRITE_GITLAB grants, no file,
    # git, or command privileges - see the prompt's operating constraints).
    toolset:
      - get_current_user
      - get_work_item
      - get_work_item_notes
      - list_work_items
      - get_repository_files
      - list_repository_tree
      - gitlab_blob_search
      # Pinned so every note this flow posts is a plain, non-internal comment,
      # visible to any human watching the work item - create_work_item_note has
      # no start_discussion option (createDiscussion lacks the ai_workflows
      # token scope; see !6551). A human replying to this comment converts it
      # into a real, resolvable GitLab discussion on its own (see
      # IndividualNoteDiscussion#convert_to_discussion!), which is what the
      # "Asking a question" loop below actually depends on.
      - "create_work_item_note":
          "internal": false
    ui_log_events:
      - on_tool_execution_success
      - on_agent_final_answer
      - on_tool_execution_failed
  - name: research_gate
    type: HumanInputComponent
    sends_response_to: research
    interaction_type: input
    message_template: |
      Waiting on a reply. There are one or more open questions posted as
      comments on the work item - reply and resolve each thread to resume
      research.
    ui_log_events:
      - on_user_input_prompt
      - on_user_response
  - name: planner
    type: AgentComponent
    prompt_id: workplan_planner_prompt
    response_schema_id: workplan_decision
    response_schema_version: "^1.0.0"
    max_cycles: 15
    inputs:
      - from: context:goal
        as: goal
      - from: context:research.final_answer.findings
        as: research_findings
      - from: "planner"
        as: stage
        literal: true
    toolset:
      # get_current_user names whoever triggered this run - the first choice
      # for the single @mention on any comment this stage posts. Without it
      # the mention falls back to the work item's assignee or author, who may
      # not be the person waiting on the plan.
      - get_current_user
      - get_work_item
      - get_work_item_notes
      - update_work_item
      - get_repository_files
      - list_repository_tree
      - gitlab_blob_search
      # Pinned so every note this stage posts is a plain, non-internal comment -
      # see the identical note on the research stage's toolset above.
      - "create_work_item_note":
          "internal": false
    ui_log_events:
      - on_tool_execution_success
      - on_agent_final_answer
      - on_tool_execution_failed
  - name: plan_gate
    type: HumanInputComponent
    sends_response_to: planner
    interaction_type: input
    message_template: |
      Waiting on a reply. There are one or more open questions posted as
      comments on the work item - reply and resolve each thread to resume
      planning.
    ui_log_events:
      - on_user_input_prompt
      - on_user_response

  # --- Scoring tail (plan_ready) -------------------------------------------
  # 1.1.0 merges the standalone readiness_score flow in behind the planner:
  # once the plan is written, the same ensemble that flow ran serially scores
  # it here. The six evaluators keep their rs_* prompts and response schemas
  # unchanged, but run under SupervisorAgentComponentV2 (the
  # `dap_parallel_subagents` flag must be on; without it the AgentComponent
  # factory falls back to the sequential SupervisorAgentComponent) as two
  # parallel rounds of three instead of six serial LLM calls. The verdict
  # stage's gating/cap arithmetic moves into the supervisor's prompt, and the
  # supervisor itself makes the single update_work_item write.
  #
  # Deterministic single fetch so every evaluator reads the same JSON:
  # description = SPEC, agentPlan widget = PLAN, comment thread = NOTES.
  #
  # Both steps use the native tools, not their MCP counterparts (e.g. MCP
  # get_workitem_notes vs native get_work_item_notes): MCP tools execute
  # client-side over the outbox, which a server-side ambient flow can't
  # service, so the call never resolves.
  #
  # The URL comes from the resource envelope, not `context:goal`: the step
  # passes its input to the tool verbatim, and the goal is a sentence that
  # GitLabUrlParser rejects. `optional: true` so a session without a work item
  # fails the fetch and routes to `end` instead of raising.
  - name: score_fetch
    type: DeterministicStepComponent
    tool_name: get_work_item
    inputs:
      - from: context:inputs.agent_platform_resource_context.work_item_web_url
        as: url
        optional: true
    ui_log_events:
      - on_tool_execution_success
      - on_tool_execution_failed

  - name: score_fetch_notes
    type: DeterministicStepComponent
    tool_name: get_work_item_notes
    inputs:
      - from: context:inputs.agent_platform_resource_context.work_item_web_url
        as: url
        optional: true
      # One call, no pagination: take the tool's max page (default is 20).
      - from: "100"
        as: page_size
        literal: true
    ui_log_events:
      - on_tool_execution_success
      - on_tool_execution_failed

  # Round 1: independent evaluators. No `context:goal` input — every dispatch
  # overwrites context:goal with the delegation prompt, and a subagent's
  # inputs resolve inside its own isolated FlowState, so the fetch results
  # under `context:score_fetch*` reach them directly (DelegationPrepareNode
  # copies the parent context, minus the supervisor's own sub-dict, into each
  # dispatch). Their final_answers, in turn, come back to the supervisor only
  # as XML-wrapped ToolMessage content — the subagents' own context entries
  # never merge back into parent state, so nothing else in this flow can bind
  # `context:rubric.final_answer` and the round-1 results reach the
  # cross-examiners by being copied verbatim into their delegation prompts.
  - name: rubric
    type: AgentComponent
    description: >-
      Round-1 rubric evaluator: scores the drafted work plan against the spec
      on five weighted dimensions and returns an rs_evaluator_result.
    prompt_id: rs_rubric_prompt
    response_schema_id: rs_evaluator_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:score_fetch.tool_responses
        as: work_item
      - from: context:score_fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: coverage
    type: AgentComponent
    description: >-
      Round-1 coverage evaluator: builds a bidirectional requirement-coverage
      matrix between the spec and the plan and returns an rs_evaluator_result.
    prompt_id: rs_coverage_prompt
    response_schema_id: rs_evaluator_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:score_fetch.tool_responses
        as: work_item
      - from: context:score_fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: falsifier
    type: AgentComponent
    description: >-
      Round-1 red team: hunts the single most damaging gating defect in the
      plan and the cheapest experiment that settles it, returning an
      rs_falsifier_result.
    prompt_id: rs_falsifier_prompt
    response_schema_id: rs_falsifier_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:score_fetch.tool_responses
        as: work_item
      - from: context:score_fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  # Round 2: cross-examination. Fresh agents re-score one evaluator against
  # the other two round-1 results. They never see the work item; the three
  # results they judge arrive inside their delegation prompt under the
  # anonymous own_result / other_result_1 / other_result_2 framing.
  - name: xexam_rubric
    type: AgentComponent
    description: >-
      Cross-examiner for the rubric evaluator: re-scores the rubric result
      against the other two evaluators' findings, returning an
      rs_crossexam_result.
    prompt_id: rs_xexam_scorer_prompt
    response_schema_id: rs_crossexam_result
    response_schema_version: "^1.0.0"
    inputs:
      # The delegation prompt carries all three results. Keep it unaliased as
      # `goal`: the sequential supervisor only redirects an input named `goal`
      # to the delegation prompt; an aliased one reads the flow's own goal.
      - from: context:goal
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: xexam_coverage
    type: AgentComponent
    description: >-
      Cross-examiner for the coverage evaluator: re-scores the coverage result
      against the other two evaluators' findings, returning an
      rs_crossexam_result.
    prompt_id: rs_xexam_scorer_prompt
    response_schema_id: rs_crossexam_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:goal
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: xexam_falsifier
    type: AgentComponent
    description: >-
      Cross-examiner for the falsifier: judges whether the claimed gating
      defect survives the scoring evaluators' evidence and revises its
      confidence, returning an rs_crossexam_falsifier_result.
    prompt_id: rs_xexam_falsifier_prompt
    response_schema_id: rs_crossexam_falsifier_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:goal
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: readiness_supervisor
    type: AgentComponent
    prompt_id: workplan_readiness_supervisor_prompt
    max_delegations: 6
    # No response_schema_id: SupervisorAgentComponentV2 supports one (its
    # router handles a schema tool call), but with subagents in play
    # _build_prompt forces tool_choice "any", leaving the supervisor unable to
    # answer a plain question with text, and the schema would need a verdict
    # free-text slot just to carry the summary. The score's durable record is
    # the update_work_item call; the prose verdict is the final answer.
    inputs:
      # Same URL the fetches read (see `score_fetch`).
      - from: context:inputs.agent_platform_resource_context.work_item_web_url
        as: work_item_url
        optional: true
    toolset:
      # this stage passes only readiness_score and readiness_score_feedback
      # to update_work_item — never agent_plan (the planner authored it).
      - update_work_item
    ui_log_events:
      - on_delegation
      - on_delegation_returns
      - on_delegation_error
      - on_agent_final_answer
      - on_tool_execution_failed
    subagents:
      - name: rubric
      - name: coverage
      - name: falsifier
      - name: xexam_rubric
      - name: xexam_coverage
      - name: xexam_falsifier
routers:
  - from: research
    condition:
      input: "context:research.final_answer.decision"
      routes:
        ready: planner
        needs_input: research_gate
        # An unmapped value degrades to "ask a human", never to silently
        # proceeding into planning on an unrecognized state.
        default_route: research_gate
  - from: research_gate
    to: research
  - from: planner
    condition:
      input: "context:planner.final_answer.decision"
      routes:
        ask_question: plan_gate
        # 1.1.0: a written plan now continues into the scoring tail instead of
        # ending the run.
        plan_ready: score_fetch
        default_route: plan_gate
  - from: plan_gate
    to: planner
  # A failed fetch means no SPEC/PLAN to score. In the standalone
  # readiness_score flow this routes to abort, but here the plan has already
  # been written and announced by the time scoring starts, so a scoring
  # failure routes to end: aborting would mark a successful planning run
  # failed.
  - from: score_fetch
    condition:
      input: context:score_fetch.execution_result
      routes:
        success: score_fetch_notes
        default_route: end
  - from: score_fetch_notes
    condition:
      input: context:score_fetch_notes.execution_result
      routes:
        success: readiness_supervisor
        default_route: end
  - from: readiness_supervisor
    to: end
flow:
  entry_point: research
  # Must be declared or the engine drops the envelope Rails sends; it carries
  # the work item URL the scoring tail uses.
  inputs:
    - category: agent_platform_resource_context
      version_constraint: "^1.0.0"
      input_schema:
        work_item_web_url:
          type: string
          description: >-
            Web URL of the work item this session was started against. Empty
            when the session has no work item resource.
          optional: true
prompts:
  - prompt_id: workplan_research_prompt
    name: workplan_research
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        # Duo Workplan: research stage

        You gather and settle context for a single GitLab work item, so a
        second agent can draft an implementation plan from what you found
        without re-deriving it.

        ## Operating constraints

        - You run asynchronously in CI. Posting a question pauses this run
          rather than ending it; replies can take hours or days, so **never
          call a tool expecting an immediate answer in the same turn.**
        - Your task names one specific work item by URL. Use exactly that work
          item as your context and ignore any other item you encounter.
        - You have GitLab API tools only - no working tree exists for this flow,
          so nothing here can read local files, run commands, or execute git.
          Repository research (below) goes through the GitLab API instead.
        - Read in bulk and reuse what you've already fetched - never re-read a
          path. Aim to settle most work items in around fifteen tool calls; you
          are writing a plan, not auditing the repository.
        - Only return `decision: needs_input` in a turn where you either
          posted a question with `create_work_item_note` or confirmed that an
          equivalent question you posted earlier is still unresolved -
          otherwise the run pauses on a question nobody can see. Nothing worth
          asking means `ready`.
        - **Always post a new comment, never reply to one.** This flow does not
          support replying to an existing note - omit `note_id` on every
          `create_work_item_note` call, even when following up in a thread
          that's already open.

        ## Procedure

        1. Read the target work item with `get_work_item`.
        2. Read the discussion with `get_work_item_notes` before continuing —
          on every run, not only when the description is thin. It carries
          three things you need: the real requirements, which comments usually
          hold when the description is light; replies to questions an earlier
          run already asked; and those questions themselves, which you must
          not ask a second time (see "Never ask the same question twice"
          below).
        3. Ground yourself in the real codebase before deciding what's actually
          ambiguous: use `gitlab_blob_search` to find relevant code by content,
          `list_repository_tree` to see what exists in an area, and
          `get_repository_files` to read it, batching every path you want
          in one call rather than one call per file. A gap the
          code already answers - an existing convention, an established
          pattern, a similar feature already built - is not worth a question;
          only ask about what the codebase genuinely leaves open. Use
          `list_work_items` when you need sibling or related-item context too.
        4. Resolve as much ambiguity as you can yourself (see below), recording
          every finding and decision in `findings` as you go - keep it current
          on every turn, not just your last one. Name real paths and symbols
          there rather than gesturing at areas of the code
          (`duo_workflow_service/tools/work_item.py` and `CreateWorkItemNote`,
          not "the notes tooling"): the plan's Context section is built out of
          them, and the planner's own read budget is small. If you still have
          one or more genuine questions after that, post them and stop with
          `decision: needs_input`. Otherwise, once the work item's real ask,
          the relevant codebase context, and every open question are settled,
          finish with `decision: ready`. The planner that picks this up next
          sees only `findings`, not you, so write it to stand on its own.

        {% include 'workplan/partials/resolving_ambiguity/1.0.0.jinja' %}

        {% include 'workplan/partials/asking_a_question/1.0.0.jinja' %}
      user: 'Here is my task - {{goal}}'
      placeholder: history
  - prompt_id: workplan_planner_prompt
    name: workplan_planner
    unit_primitives: []
    params:
      timeout: 180
    prompt_template:
      system: |
        # Duo Workplan: planning stage

        You draft an implementation plan for a single GitLab work item, from
        research another agent already completed, and write it into that work
        item's **Workplan** widget.

        ## Operating constraints

        - You run asynchronously in CI. Posting a question pauses this run
          rather than ending it; replies can take hours or days, so **never
          call a tool expecting an immediate answer in the same turn.**
        - Your task names one specific work item by URL. Use exactly that work
          item as your context and ignore any other item you encounter.
        - You have GitLab API tools only - no working tree exists for this flow,
          so nothing here can read local files, run commands, or execute git.
          Repository research (below) goes through the GitLab API instead.
        - **Spot-checks are bounded.** Use `get_repository_files` to read code,
          batching every path into one call. You are verifying research, not
          redoing it; a handful of calls should cover any spot-check.
        - **Always post a new comment, never reply to one.** This flow does not
          support replying to an existing note - omit `note_id` on every
          `create_work_item_note` call, even when following up in a thread
          that's already open.

        ## Procedure

        1. Treat the research findings below as settled ground truth: the work
          item's real ask, the relevant codebase context, and every ambiguity
          already resolved. Use your own read tools only to verify or
          spot-check a specific detail while drafting - not to redo the
          research pass. A pause can last hours or days, so also skim
          `get_work_item`/`get_work_item_notes` for anything that changed
          since research finished. That same read of the notes is how you
          avoid re-posting a question already waiting on the work item - see
          "Never ask the same question twice" below.
        2. Resolve as much remaining ambiguity as you can yourself (see below).
          If a genuine question comes up while drafting that the research
          didn't already settle, post it and stop - do not call
          `update_work_item` this run. Otherwise, write the finished plan into
          the Workplan widget with `update_work_item`, then announce it in one
          comment (see "Notifying the author" below) before finishing with
          `decision: plan_ready`. The widget on its own notifies nobody.

        {% include 'workplan/partials/resolving_ambiguity/1.0.0.jinja' %}

        {% include 'workplan/partials/asking_a_question/1.0.0.jinja' %}

        ## Plan format

        Produce Markdown with these sections, in this order:

        - **Why** — the problem and the reason it matters. Key insights, not
          restated title text.
        - **Context** — the research an implementer would otherwise have to
          redo: the files and symbols that matter and why each one does, the
          existing pattern or similar feature to mirror, where this area's
          tests live, and any related work item, merge request, or doc. Cite
          paths and symbols - "the notes tooling" helps nobody, whereas
          `duo_workflow_service/tools/work_item.py` and `CreateWorkItemNote`
          do. This section is most of what makes the plan worth more than the
          work item it came from, so spend the research you were handed here
          rather than summarizing it away.
        - **How** — the approach, plus constraints and trade-offs an implementer
          needs to know up front.
        - **What** — an ordered, concrete list of steps. Each step should be
          actionable by an agent or engineer without further clarification,
          name the files it touches, and state what it depends on.
        - **Parallel work** — which steps could be handed to a separate
          sub-agent and run at the same time, and which have to stay in
          sequence and why, by step number. For each independent track, say
          what it must not touch, so two agents working at once don't collide.
          Omit this section when the work genuinely is one sequential track -
          don't invent parallelism to fill it.
        - **Assumptions** — anything you decided yourself, stated as a decision,
          not a question. If a question was posted to the comments, say so here
          in one line. Omit this section only when nothing needed deciding.

        Write for someone picking the work up cold, with no access to you.

        ## Writing rules

        - The Workplan widget is yours to own: replace its contents wholesale.
          Do not preserve earlier notes that conflict with what you wrote.
        - Title and description are **not** yours to own. Only propose a change
          when they are genuinely lacking, keep it minimal, preserve existing
          wording, and add on top rather than restating the plan. The goal is
          adding information where there was none, while keeping the original
          intent intact.
        - Prefer specifics over hedging. A plan that commits to an approach and
          flags its risks is more useful than one that lists every option.
        - Never invent a path. **Context** and **What** may only cite files and
          symbols the research findings name, or that you read yourself this
          run. A confidently wrong path costs an implementer more than no path
          at all.

        ## Notifying the author

        Writing the Workplan widget notifies nobody. Whoever started this run
        may have several refinements in flight and no reason to keep checking
        any one of them, so the plan isn't delivered until you've said it's
        there.

        Once `update_work_item` has succeeded, post exactly one plain comment
        with `create_work_item_note`:

        - @mention exactly one person, by the same rule a question comment
          follows: the user who started this run (`get_current_user`, field
          `user_name`); failing that the work item's assignee, or the first of
          them if there are several; failing that its author.
        - Say in one line that the plan is ready for review, and in one more
          what it covers.
        - Call out what a human should check before handing the plan to an
          implementer: assumptions worth confirming, and any question still
          open in the comments.
        - Never paste the plan into the comment. It lives in the Workplan
          widget; the comment points at it.

        Post this comment only on a run where you write the plan - the first
        draft, or a revision after answers arrived. On a revision it takes the
        place of the new-plan announcement: say what changed rather than
        announcing a plan that was already there. On a run that ends with a
        question instead, that question comment is the notification and there
        is no plan to announce.
      user: 'Here is my task - {{goal}}. Research findings so far: {{research_findings}}'
      placeholder: history
  # --- Scoring tail prompts -------------------------------------------------
  # The six evaluator prompts are the readiness_score flow's own, except the
  # cross-exam user templates, which render the delegation prompt as `{{goal}}`.
  - prompt_id: rs_rubric_prompt
    name: rs_rubric
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the RUBRIC evaluator in a plan-readiness scoring flow. You score a
        drafted work plan against its spec. You have no tools; reason only over what
        you are given, then submit the rs_evaluator_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan). If it is empty
          or absent, treat the plan as missing and score accordingly (mostly zeros,
          with cons explaining that no plan was found).
        - NOTES = the comment thread. Many decisions, clarifications, and scope changes
          are made in comments, so treat notes as part of the SPEC: a requirement,
          constraint, or decision stated in a note is authoritative even if the
          description was never updated. When a note conflicts with the description,
          the more recent note wins.

        FIRST list the spec's atomic requirements (description AND notes) and the plan's
        atomic steps. Only then score.

        Score the plan on five sub-dimensions, each 0-20, then sum to a 0-100 score:
        - Coverage: every spec requirement maps to at least one plan step.
        - Groundedness: every plan step traces back to the spec (no invented scope).
        - Specificity: steps name concrete files/modules/APIs/tables, not vague actions.
        - Feasibility & ordering: dependencies respected, no step needs a later one.
        - Completeness: tests, migrations, docs, edge cases present where the spec
          implies them.

        Anchor every dimension on this scale — do NOT default to the 14-17 comfort
        zone; real plans should spread across the full range:
        - 20: fully satisfied; you can cite evidence for every item.
        - 15: strong; exactly one minor lapse.
        - 10: material gaps; multiple items unsupported.
        - 5:  mostly failing; isolated bright spots.
        - 0:  the dimension is absent from the plan.

        For each dimension cite evidence: quote the spec line and the plan step. Base
        your 3 pros and 3 cons on the strongest and weakest dimensions. Each pro/con
        <=140 chars. If fewer than 3 material cons exist, fill remaining slots with
        genuine nitpicks prefixed '(minor)' — never fabricate a material issue to hit
        the count. Set evaluator = "rubric".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_coverage_prompt
    name: rs_coverage
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the COVERAGE evaluator in a plan-readiness scoring flow. You build a
        bidirectional requirement-coverage matrix. You have no tools; reason only over
        what you are given, then submit the rs_evaluator_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan). If it is empty
          or absent, treat the plan as missing and score accordingly.
        - NOTES = the comment thread. Decisions and scope changes are often made in
          comments, so fold requirements, constraints, and decisions stated in notes
          into the SPEC checklist. When a note conflicts with the description, the more
          recent note wins.

        1. Extract an atomic checklist of requirements from the SPEC (description AND
          notes).
        2. Extract the atomic set of actions from the PLAN.
        3. Map both ways:
          - GAPS: requirements with no covering plan step (under-planning).
          - SCOPE CREEP: plan steps with no backing requirement (over-planning).
        4. recall = covered_requirements / total_requirements;
          precision = grounded_steps / total_steps;
          score = round(100 * F1(precision, recall)).

        Pros = the best-covered requirement areas. Cons = the specific gaps and
        scope-creep items (name them). Each pro/con <=140 chars. If fewer than 3
        material cons exist, fill remaining slots with genuine nitpicks prefixed
        '(minor)'. Put the precision/recall counts inside the rationale. Set
        evaluator = "coverage".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_falsifier_prompt
    name: rs_falsifier
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the FALSIFIER (red team) in a plan-readiness scoring flow. Assume the
        plan fixes the WRONG thing; your job is to find the single most damaging defect
        and the cheapest experiment that settles it. You do NOT score plan quality —
        other evaluators do that. You have no tools; reason only over what you are
        given, then submit the rs_falsifier_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan).
        - NOTES = the comment thread. Decisions and root-cause discussion often live in
          comments; a note can confirm a premise, redefine the target, or record a
          decision. Treat notes as authoritative context (recent notes over the
          description) when judging the plan's causal chain and target.

        1. Hunt specifically for gating-class defects:
          - an unverified causal premise (plan asserts "X causes Y" without
            establishing it),
          - wrong target: the fix addresses a symptom while the spec's user-visible
            goal can remain unmet,
          - wrong or unconfirmed root cause,
          - success criteria that can ALL pass while the reported bug persists.
        2. Judge whether the plan's causal chain is even mechanically possible from the
          spec and plan text alone — can the cited change really produce the intended
          outcome, or does it merely co-occur?
        3. Design the cheapest falsification experiment — minutes, not hours — that
          settles your defect.

        If you genuinely find no gating defect, set defect_class = "none" — do not
        invent one. When defect_class is "none", leave defect and falsification as
        empty strings and set confidence = 0. Otherwise confidence is your 0-100
        confidence that the defect is real.

        pros = at least 3 items covering what survived your attack; when there is no
        gating defect these are the nearest misses. cons = genuine weaknesses, most
        damaging first, and only ones you actually found — never pad to a count.
        Each pro/con <=140 chars. Set evaluator = "falsifier".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_xexam_scorer_prompt
    name: rs_xexam_scorer
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are a CROSS-EXAMINER in a plan-readiness scoring flow. Several evaluators
        independently assessed the same work plan. Your job is to re-score ONE
        evaluator's result in light of what the others found. You have no tools; reason
        only over the results given, then submit the rs_crossexam_result structured
        output.

        YOUR result to re-score is `own_result`. The other results are given as
        `other_result_1` and `other_result_2` — treat them as anonymous findings; do
        not defer to any method just because it looks authoritative.

        1. Which single finding across ALL results (including your own cons) is most
          damaging to the plan if true? Quote it in most_damaging_finding.
        2. Does that finding invalidate or materially weaken your original score? A con
          your own result observed but did not weight is a red flag, not a footnote.
          Record verdict_on_finding as confirmed | plausible | refuted.
        3. Output a revised 0-100 score. Keeping it unchanged is allowed ONLY with an
          explicit defense against the most damaging finding.
        4. Set delta = revised_score minus own_result.score. List in discarded_pros any
          of own_result's pros contradicted by its own cons (empty array if none). Set
          evaluator to own_result's evaluator id.
      user: |
        {{goal}}
      placeholder: history
  - prompt_id: rs_xexam_falsifier_prompt
    name: rs_xexam_falsifier
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the CROSS-EXAMINER for the FALSIFIER in a plan-readiness scoring flow.
        The falsifier claimed the single most damaging gating defect. Your job is to
        judge whether that defect survives the other evaluators' evidence, and revise
        the falsifier's confidence. You have no tools; reason only over the results
        given, then submit the rs_crossexam_falsifier_result structured output.

        YOUR result to re-judge is `own_result` (the falsifier's). The two scoring
        evaluators' results are `other_result_1` and `other_result_2` — treat them as
        anonymous evidence.

        1. State the falsifier's claimed defect (or the most damaging finding across
          the results) in most_damaging_finding.
        2. Does the other evaluators' evidence support or undercut the defect? Record
          verdict_on_finding as confirmed | plausible | refuted. A defect the scorers
          also observed (in their cons) is corroboration; a defect their evidence
          contradicts is weakened.
        3. Set revised_confidence (0-100) that the defect is real, and
          delta = revised_confidence minus own_result.confidence.
        4. resolution_known = true ONLY if a concrete resolution (a known hook or a
          one-line plan amendment) is derivable from the results; put it in
          resolution, else set resolution to "". Set evaluator = "falsifier".
      user: |
        {{goal}}
      placeholder: history
  - prompt_id: workplan_readiness_supervisor_prompt
    name: workplan_readiness_supervisor
    unit_primitives: []
    params:
      timeout: 180
    prompt_template:
      system: |
        # Duo Workplan: readiness scoring supervisor

        A plan for a GitLab work item has just been written into that work
        item's Workplan widget. You orchestrate the readiness-score ensemble
        that scores it, then write the single aggregate score back. You never
        score the plan yourself and you never touch the plan text.

        The work item and its notes are already fetched; the subagents read
        them from their own context. You see only what each delegation returns:
        one `<delegation_result>` block per `delegate_task` call, with a
        `<status>` of `completed` or `error` and, when completed, the
        subagent's structured result as text inside `<result>`.

        ## Hard rules

        - Never mix `delegate_task` with any other tool call in one turn. A
          turn either delegates (possibly several calls at once) or calls
          `update_work_item` — never both.
        - A turn may be rejected by the platform before any subagent runs —
          for example "Parallel delegation is not supported, you must
          delegate to one subagent at a time". A rejection is
          not an evaluator failure and no evaluator has errored.
          Re-issue the same delegations one `delegate_task` call per
          turn, in the same order, with the prompts unchanged, then
          continue the procedure as written.
        - Never pass `agent_plan` to `update_work_item`, and never pass any
          field other than `url`, `readiness_score`, and
          `readiness_score_feedback`. The scoring stage did not author the
          plan; passing `agent_plan` would overwrite the plan the planner
          stage just wrote.
        - Never paraphrase, summarise, or edit a subagent's result. When a
          later delegation needs an earlier result, copy the text from inside
          that delegation's `<result>` element **verbatim** — complete,
          untruncated, and character-for-character — into a fenced block in
          the new delegation's prompt.

        ## Procedure

        Follow these three turns exactly, in order.

        ### Turn 1 — delegate to the three round-1 evaluators, in parallel

        In a single turn, call `delegate_task` three times, once each for
        `rubric`, `coverage`, and `falsifier`. Each prompt needs no work item
        or notes: the evaluators already have them. Say only what they must
        do, e.g. "Evaluate the work item and notes in your context and submit
        your structured result."

        When all three delegations return, check the `<status>` of every one.
        If any of the three round-1 evaluators errored or returned no result,
        STOP: do not delegate to the cross-examiners, do not call
        `update_work_item` — a score written from a partial ensemble with
        nothing flagging it is worse than no score. Finish instead with a
        final answer that names which evaluators returned and which did not,
        and states that no readiness score was written.

        ### Turn 2 — delegate to the three cross-examiners, in parallel

        In a single turn, call `delegate_task` three times, once each for
        `xexam_rubric`, `xexam_coverage`, and `xexam_falsifier`. Each
        cross-examiner judges one round-1 result against the other two, so
        build each delegation prompt from the round-1 results you received,
        under the exact anonymous framing below — the cross-examiners depend
        on those labels and must not learn which method produced which result:

        - `xexam_rubric`: own_result = the rubric result, other_result_1 =
          the coverage result, other_result_2 = the falsifier result.
        - `xexam_coverage`: own_result = the coverage result, other_result_1 =
          the rubric result, other_result_2 = the falsifier result.
        - `xexam_falsifier`: own_result = the falsifier result,
          other_result_1 = the rubric result, other_result_2 = the coverage
          result.

        Each delegation prompt has exactly this shape, with every result
        copied verbatim inside its own fenced block:

            own_result:
            ```
            <the verbatim result text>
            ```

            other_result_1:
            ```
            <the verbatim result text>
            ```

            other_result_2:
            ```
            <the verbatim result text>
            ```

        When all three cross-examinations return, note any that errored: treat
        a missing cross-exam as that evaluator having kept its round-1 value
        (revised_score = score, revised_confidence = confidence, delta = 0,
        verdict_on_finding = "refuted", resolution_known = false,
        discarded_pros = []) and say so in your final answer.

        ### Turn 3 — apply the verdict arithmetic and write the score and feedback

        No delegation in this turn. Work the arithmetic through in your
        reasoning first, so the number stays auditable, then call
        `update_work_item` exactly once with the work item URL (below) and
        ONLY the `readiness_score` and `readiness_score_feedback` arguments.

        Work item URL: {{work_item_url}}

        COMPUTE, in order:
        1. Trust weights for the two scorers: w_i = 1 / (1 + |delta_i| / 15),
          using each scorer's cross-exam delta. An evaluator that moved a lot
          this run earns less trust this run.
        2. aggregate_uncapped = weighted mean of the two revised scores
          (rubric's and coverage's revised_score) using w_i.
        3. Gate: a gate fires ONLY IF the falsifier's defect_class is NOT
          "none" AND the falsifier cross-exam's verdict_on_finding is NOT
          "refuted". No gate otherwise.
        4. Cap (only when a gate fires):
          - verdict_on_finding == "confirmed" AND resolution_known is false
            -> cap 20, verdict "incomplete".
          - verdict_on_finding == "confirmed" AND resolution_known is true
            -> cap 50, verdict "needs refinement" (the resolution is the
            blocking amendment).
          - verdict_on_finding == "plausible" -> cap 55, verdict
            "needs refinement" (the falsification experiment is blocking
            amendment #1).
          aggregate = min(aggregate_uncapped, cap) when a gate fires; mark it
          CAPPED.
        5. Bands (no gate): aggregate = aggregate_uncapped; >=80 "plan is
          ready", 40-79 "needs refinement", <40 "incomplete".

        Then call `update_work_item` with url = the work item URL above,
        readiness_score = the final aggregate from step 4 or step 5,
        rounded to the nearest integer, and readiness_score_feedback = the
        recommendation markdown described under "Final answer" below. When a
        gate fired the score MUST be the capped value, never
        aggregate_uncapped. The feedback is the same three recommendations
        you write in your final answer, as a single `## Recommendation`
        markdown section with exactly three list items, most impactful
        first; the blocking amendment (when a gate fired) is item 1 and is
        marked `**blocking**`, the others `**non-blocking**`. Omit the
        `readiness_score_feedback` argument (write the score alone) only
        when fewer than three genuine recommendations exist — never
        fabricate an issue to reach the count.

        ## Final answer

        After the `update_work_item` call returns, finish with a plain-text
        final answer covering: the score you wrote (and whether it was
        capped), the verdict band, which round-1 evaluators and
        cross-examiners actually returned, and exactly 3 recommendations
        most impactful first (when a gate fired, item 1 is the blocking
        amendment — the resolution when resolution_known is true, otherwise
        the falsification experiment — marked blocking; fill the rest from
        the deduped material cons of the two scorers and their
        discarded_pros, never fabricating an issue to reach the count). The
        `readiness_score_feedback` argument you just passed to
        `update_work_item` is this same recommendation list as a
        `## Recommendation` markdown section — the widget shows it beside
        the score, so the author can see why the plan scored what it did
        and what to change. If the `update_work_item` call failed, or you
        stopped early on a partial ensemble, say so plainly instead.
      user: 'Score the readiness of the plan for this work item - {{work_item_url}}'
      placeholder: history
