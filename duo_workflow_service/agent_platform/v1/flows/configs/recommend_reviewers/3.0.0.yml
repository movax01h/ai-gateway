version: "v1"
environment: ambient
components:
  - name: "suggest_reviewers"
    type: OneOffComponent
    prompt_id: "recommend_reviewers_assign"
    prompt_version: "^2.0.0"
    inputs:
      - from: "context:inputs.agent_platform_resource_context.merge_request_id"
        as: "merge_request_iid"
      - from: "context:project_id"
        as: "project_id"
      - from: "context:inputs.agent_platform_recommend_reviewers_context"
        as: "reviewer_data"
        optional: true
    toolset:
      - "post_suggested_reviewers"
    max_correction_attempts: 3
    ui_log_events:
      - "on_tool_execution_success"
      - "on_tool_execution_failed"

routers:
  - from: "suggest_reviewers"
    to: "end"

flow:
  entry_point: "suggest_reviewers"
  inputs:
    - category: agent_platform_recommend_reviewers_context
      version_constraint: "^1.0.0"
      input_schema:
        current_reviewers:
          type: array
        approval_rules:
          type: array
    - category: agent_platform_resource_context
      version_constraint: "^1.0.0"
      input_schema:
        merge_request_id:
          type: string
