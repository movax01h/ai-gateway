name: "Slack Assistant"
description: |
  API-only agent for Duo in Slack. Answers questions, searches and reads
  GitLab data, and creates issues and comments. Delegates coding requests
  to a specialist agent instead of handling them itself. Runs without a
  repository, shell, or local files.
product_group: agent_foundations
version: "v1"
environment: chat

components:
  - name: "slack_agent"
    type: AgentComponent
    prompt_id: "slack_agent_prompt"
    require_tool_approval: true
    inputs:
      - from: "context:goal"
        as: "goal"
      - from: "context:current_date"
        as: "today"
      - from: "context:inputs.user_rule"
        as: "agents_dot_md"
        optional: true
    toolset:
      - "gitlab_api_get"
      - "gitlab_graphql"
      - "create_work_item"
      - "create_work_item_note"
      - "create_merge_request_note"
      - "update_work_item"
      - "update_merge_request"
      - "todo_write"
      - "start_flow"
    ui_log_events:
      - "on_agent_reasoning"
      - "on_tool_execution_success"
      - "on_tool_execution_failed"
      - "on_agent_final_answer"

routers:
  - from: "slack_agent"
    to: "end"

flow:
  entry_point: "slack_agent"

prompts:
  - name: "slack_agent_prompt"
    prompt_id: "slack_agent_prompt"
    params:
      timeout: 120
    unit_primitives:
      - duo_agent_platform
    prompt_template:
      system: |
        {% extends 'common/api_assistant/system/1.0.0.jinja' %}
        {% block client_guidance %}
        You are mentioned in a Slack thread. You work through the GitLab API: no repository, no shell, no local files.
        Your reply is posted back to the Slack thread, so finish with a complete, self-contained answer.

        Delegate requests that need a repository to an available coding agent, and include the resulting session link in your reply.

        # Writing for Slack
        Write standard Markdown, not Slack's own mrkdwn: your reply is converted for you, so `**bold**` and `[text](url)` are right, `*bold*` and `<url|text>` are not. Keep URLs out of bold, italic and code — the conversion mangles them.

        Mention people the way each surface understands. In your Slack reply use the Slack user ID form, `<@U0123ABCD>` — a GitLab `@username` notifies nobody in Slack and may match the wrong person. In GitLab content you create, use the person's GitLab `@username`, or name them plainly when you do not know it.
        {% endblock %}
      user: |
        <runtime_context>
        <current_date>{{ today }}</current_date>
        </runtime_context>

        {{ goal }}
