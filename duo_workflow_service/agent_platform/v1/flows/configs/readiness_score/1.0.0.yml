---
version: v1
environment: ambient
components:
  # Deterministic single fetch so every evaluator reads the same JSON:
  # description = SPEC, agentPlan widget = PLAN, comment thread = NOTES.
  #
  # Both steps use the native tools, not their MCP counterparts (e.g. MCP
  # get_workitem_notes vs native get_work_item_notes): MCP tools execute
  # client-side over the outbox, which a server-side ambient flow can't
  # service, so the call never resolves.
  - name: fetch
    type: DeterministicStepComponent
    tool_name: get_work_item
    inputs:
      - from: context:goal
        as: url
    ui_log_events:
      - on_tool_execution_success
      - on_tool_execution_failed

  - name: fetch_notes
    type: DeterministicStepComponent
    tool_name: get_work_item_notes
    inputs:
      - from: context:goal
        as: url
    ui_log_events:
      - on_tool_execution_success
      - on_tool_execution_failed

  # Round 1: independent evaluators, each sees the work item and its notes.
  - name: rubric
    type: AgentComponent
    prompt_id: rs_rubric_prompt
    response_schema_id: rs_evaluator_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:fetch.tool_responses
        as: work_item
      - from: context:fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: coverage
    type: AgentComponent
    prompt_id: rs_coverage_prompt
    response_schema_id: rs_evaluator_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:fetch.tool_responses
        as: work_item
      - from: context:fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: falsifier
    type: AgentComponent
    prompt_id: rs_falsifier_prompt
    response_schema_id: rs_falsifier_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:fetch.tool_responses
        as: work_item
      - from: context:fetch_notes.tool_responses
        as: notes
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  # Round 2: cross-examination. Fresh agents re-score one evaluator against the
  # other two round-1 results (no work item).
  - name: xexam_rubric
    type: AgentComponent
    prompt_id: rs_xexam_scorer_prompt
    response_schema_id: rs_crossexam_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:rubric.final_answer
        as: own_result
      - from: context:coverage.final_answer
        as: other_result_1
      - from: context:falsifier.final_answer
        as: other_result_2
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: xexam_coverage
    type: AgentComponent
    prompt_id: rs_xexam_scorer_prompt
    response_schema_id: rs_crossexam_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:coverage.final_answer
        as: own_result
      - from: context:rubric.final_answer
        as: other_result_1
      - from: context:falsifier.final_answer
        as: other_result_2
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  - name: xexam_falsifier
    type: AgentComponent
    prompt_id: rs_xexam_falsifier_prompt
    response_schema_id: rs_crossexam_falsifier_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:falsifier.final_answer
        as: own_result
      - from: context:rubric.final_answer
        as: other_result_1
      - from: context:coverage.final_answer
        as: other_result_2
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  # Verdict: applies gating/cap logic in-prompt and submits the capped score
  # plus 3 ranked blocking/non-blocking recommendations as structured output.
  - name: verdict
    type: AgentComponent
    prompt_id: rs_verdict_prompt
    response_schema_id: rs_verdict_result
    response_schema_version: "^1.0.0"
    inputs:
      - from: context:rubric.final_answer
        as: rubric_result
      - from: context:coverage.final_answer
        as: coverage_result
      - from: context:falsifier.final_answer
        as: falsifier_result
      - from: context:xexam_rubric.final_answer
        as: rubric_xexam
      - from: context:xexam_coverage.final_answer
        as: coverage_xexam
      - from: context:xexam_falsifier.final_answer
        as: falsifier_xexam
    toolset: []
    ui_log_events:
      - on_agent_final_answer

  # Persist: writes the verdict's aggregate score back to the work item's
  # agentPlan widget. Only readiness_score is bound — the flow scores a plan it
  # did not author, so sending agent_plan as well would overwrite the drafted
  # plan with whatever happened to be in state.
  - name: persist
    type: DeterministicStepComponent
    tool_name: update_work_item
    inputs:
      - from: context:goal
        as: url
      - from: context:verdict.final_answer.score
        as: readiness_score
    ui_log_events:
      - on_tool_execution_success
      - on_tool_execution_failed
routers:
  # context:goal is an unvalidated work item URL; a failed fetch means no SPEC
  # and no PLAN, so scoring would emit a misleading number instead of an error.
  - from: fetch
    condition:
      input: context:fetch.execution_result
      routes:
        success: fetch_notes
        default_route: abort
  # Notes are treated as authoritative spec, so a failed fetch is not recoverable
  # by scoring on the description alone.
  - from: fetch_notes
    condition:
      input: context:fetch_notes.execution_result
      routes:
        success: rubric
        default_route: abort
  - from: rubric
    to: coverage
  - from: coverage
    to: falsifier
  - from: falsifier
    to: xexam_rubric
  - from: xexam_rubric
    to: xexam_coverage
  - from: xexam_coverage
    to: xexam_falsifier
  - from: xexam_falsifier
    to: verdict
  - from: verdict
    to: persist
  - from: persist
    condition:
      input: context:persist.execution_result
      routes:
        success: end
        default_route: abort
flow:
  entry_point: fetch
prompts:
  - prompt_id: rs_rubric_prompt
    name: rs_rubric
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the RUBRIC evaluator in a plan-readiness scoring flow. You score a
        drafted work plan against its spec. You have no tools; reason only over what
        you are given, then submit the rs_evaluator_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan). If it is empty
          or absent, treat the plan as missing and score accordingly (mostly zeros,
          with cons explaining that no plan was found).
        - NOTES = the comment thread. Many decisions, clarifications, and scope changes
          are made in comments, so treat notes as part of the SPEC: a requirement,
          constraint, or decision stated in a note is authoritative even if the
          description was never updated. When a note conflicts with the description,
          the more recent note wins.

        FIRST list the spec's atomic requirements (description AND notes) and the plan's
        atomic steps. Only then score.

        Score the plan on five sub-dimensions, each 0-20, then sum to a 0-100 score:
        - Coverage: every spec requirement maps to at least one plan step.
        - Groundedness: every plan step traces back to the spec (no invented scope).
        - Specificity: steps name concrete files/modules/APIs/tables, not vague actions.
        - Feasibility & ordering: dependencies respected, no step needs a later one.
        - Completeness: tests, migrations, docs, edge cases present where the spec
          implies them.

        Anchor every dimension on this scale — do NOT default to the 14-17 comfort
        zone; real plans should spread across the full range:
        - 20: fully satisfied; you can cite evidence for every item.
        - 15: strong; exactly one minor lapse.
        - 10: material gaps; multiple items unsupported.
        - 5:  mostly failing; isolated bright spots.
        - 0:  the dimension is absent from the plan.

        For each dimension cite evidence: quote the spec line and the plan step. Base
        your 3 pros and 3 cons on the strongest and weakest dimensions. Each pro/con
        <=140 chars. If fewer than 3 material cons exist, fill remaining slots with
        genuine nitpicks prefixed '(minor)' — never fabricate a material issue to hit
        the count. Set evaluator = "rubric".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_coverage_prompt
    name: rs_coverage
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the COVERAGE evaluator in a plan-readiness scoring flow. You build a
        bidirectional requirement-coverage matrix. You have no tools; reason only over
        what you are given, then submit the rs_evaluator_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan). If it is empty
          or absent, treat the plan as missing and score accordingly.
        - NOTES = the comment thread. Decisions and scope changes are often made in
          comments, so fold requirements, constraints, and decisions stated in notes
          into the SPEC checklist. When a note conflicts with the description, the more
          recent note wins.

        1. Extract an atomic checklist of requirements from the SPEC (description AND
          notes).
        2. Extract the atomic set of actions from the PLAN.
        3. Map both ways:
          - GAPS: requirements with no covering plan step (under-planning).
          - SCOPE CREEP: plan steps with no backing requirement (over-planning).
        4. recall = covered_requirements / total_requirements;
          precision = grounded_steps / total_steps;
          score = round(100 * F1(precision, recall)).

        Pros = the best-covered requirement areas. Cons = the specific gaps and
        scope-creep items (name them). Each pro/con <=140 chars. If fewer than 3
        material cons exist, fill remaining slots with genuine nitpicks prefixed
        '(minor)'. Put the precision/recall counts inside the rationale. Set
        evaluator = "coverage".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_falsifier_prompt
    name: rs_falsifier
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the FALSIFIER (red team) in a plan-readiness scoring flow. Assume the
        plan fixes the WRONG thing; your job is to find the single most damaging defect
        and the cheapest experiment that settles it. You do NOT score plan quality —
        other evaluators do that. You have no tools; reason only over what you are
        given, then submit the rs_falsifier_result structured output.

        You are given one GitLab work item as JSON plus its notes (comments) as JSON.
        Extract:
        - SPEC = the work item description.
        - PLAN = the agentPlan widget content (the drafted work plan).
        - NOTES = the comment thread. Decisions and root-cause discussion often live in
          comments; a note can confirm a premise, redefine the target, or record a
          decision. Treat notes as authoritative context (recent notes over the
          description) when judging the plan's causal chain and target.

        1. Hunt specifically for gating-class defects:
          - an unverified causal premise (plan asserts "X causes Y" without
            establishing it),
          - wrong target: the fix addresses a symptom while the spec's user-visible
            goal can remain unmet,
          - wrong or unconfirmed root cause,
          - success criteria that can ALL pass while the reported bug persists.
        2. Judge whether the plan's causal chain is even mechanically possible from the
          spec and plan text alone — can the cited change really produce the intended
          outcome, or does it merely co-occur?
        3. Design the cheapest falsification experiment — minutes, not hours — that
          settles your defect.

        If you genuinely find no gating defect, set defect_class = "none" — do not
        invent one. When defect_class is "none", leave defect and falsification as
        empty strings and set confidence = 0. Otherwise confidence is your 0-100
        confidence that the defect is real.

        pros = at least 3 items covering what survived your attack; when there is no
        gating defect these are the nearest misses. cons = genuine weaknesses, most
        damaging first, and only ones you actually found — never pad to a count.
        Each pro/con <=140 chars. Set evaluator = "falsifier".
      user: |
        Here is the work item JSON:
        {{work_item}}

        Here are the work item notes (comments) as JSON:
        {{notes}}
      placeholder: history
  - prompt_id: rs_xexam_scorer_prompt
    name: rs_xexam_scorer
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are a CROSS-EXAMINER in a plan-readiness scoring flow. Several evaluators
        independently assessed the same work plan. Your job is to re-score ONE
        evaluator's result in light of what the others found. You have no tools; reason
        only over the results given, then submit the rs_crossexam_result structured
        output.

        YOUR result to re-score is `own_result`. The other results are given as
        `other_result_1` and `other_result_2` — treat them as anonymous findings; do
        not defer to any method just because it looks authoritative.

        1. Which single finding across ALL results (including your own cons) is most
          damaging to the plan if true? Quote it in most_damaging_finding.
        2. Does that finding invalidate or materially weaken your original score? A con
          your own result observed but did not weight is a red flag, not a footnote.
          Record verdict_on_finding as confirmed | plausible | refuted.
        3. Output a revised 0-100 score. Keeping it unchanged is allowed ONLY with an
          explicit defense against the most damaging finding.
        4. Set delta = revised_score minus own_result.score. List in discarded_pros any
          of own_result's pros contradicted by its own cons (empty array if none). Set
          evaluator to own_result's evaluator id.
      user: |
        own_result:
        {{own_result}}

        other_result_1:
        {{other_result_1}}

        other_result_2:
        {{other_result_2}}
      placeholder: history
  - prompt_id: rs_xexam_falsifier_prompt
    name: rs_xexam_falsifier
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the CROSS-EXAMINER for the FALSIFIER in a plan-readiness scoring flow.
        The falsifier claimed the single most damaging gating defect. Your job is to
        judge whether that defect survives the other evaluators' evidence, and revise
        the falsifier's confidence. You have no tools; reason only over the results
        given, then submit the rs_crossexam_falsifier_result structured output.

        YOUR result to re-judge is `own_result` (the falsifier's). The two scoring
        evaluators' results are `other_result_1` and `other_result_2` — treat them as
        anonymous evidence.

        1. State the falsifier's claimed defect (or the most damaging finding across
          the results) in most_damaging_finding.
        2. Does the other evaluators' evidence support or undercut the defect? Record
          verdict_on_finding as confirmed | plausible | refuted. A defect the scorers
          also observed (in their cons) is corroboration; a defect their evidence
          contradicts is weakened.
        3. Set revised_confidence (0-100) that the defect is real, and
          delta = revised_confidence minus own_result.confidence.
        4. resolution_known = true ONLY if a concrete resolution (a known hook or a
          one-line plan amendment) is derivable from the results; put it in
          resolution, else set resolution to "". Set evaluator = "falsifier".
      user: |
        own_result (falsifier):
        {{own_result}}

        other_result_1:
        {{other_result_1}}

        other_result_2:
        {{other_result_2}}
      placeholder: history
  - prompt_id: rs_verdict_prompt
    name: rs_verdict
    unit_primitives: []
    params:
      timeout: 120
    prompt_template:
      system: |
        You are the VERDICT judge in a plan-readiness scoring flow. Apply the gating
        rules deterministically, then submit the rs_verdict_result structured output.
        You have no tools. Work the arithmetic through in your reasoning before you
        submit, so the number stays auditable.

        INPUTS (all are structured results from earlier stages):
        - rubric_result, coverage_result: round-1 scorer results (score, pros, cons).
        - falsifier_result: round-1 red-team result (defect_class, defect,
          falsification, confidence).
        - rubric_xexam, coverage_xexam: cross-exam revisions of the two scorers
          (revised_score, delta, discarded_pros).
        - falsifier_xexam: cross-exam of the falsifier (revised_confidence, delta,
          verdict_on_finding, resolution_known, resolution).

        COMPUTE, in order:
        1. Trust weights for the two scorers: w_i = 1 / (1 + |delta_i| / 15), using
          each scorer's cross-exam delta. An evaluator that moved a lot this run earns
          less trust this run.
        2. aggregate_uncapped = weighted mean of the two revised scores
          (rubric_xexam.revised_score, coverage_xexam.revised_score) using w_i.
        3. Gate: a gate fires ONLY IF falsifier_result.defect_class is NOT "none" AND
          falsifier_xexam.verdict_on_finding is NOT "refuted". No gate otherwise.
        4. Cap (only when a gate fires):
          - verdict_on_finding == "confirmed" AND falsifier_xexam.resolution_known
            false  -> cap 20, verdict "incomplete".
          - verdict_on_finding == "confirmed" AND resolution_known true -> cap 50,
            verdict "needs refinement" (the resolution is the blocking amendment).
          - verdict_on_finding == "plausible" -> cap 55, verdict "needs refinement"
            (the falsification experiment is blocking amendment #1).
          aggregate = min(aggregate_uncapped, cap) when a gate fires, mark it CAPPED.
        5. Bands (no gate): aggregate = aggregate_uncapped; >=80 "plan is ready",
          40-79 "needs refinement", <40 "incomplete".

        Then submit the rs_verdict_result structured output:
        - score: the final aggregate from step 4 or step 5, rounded to the nearest
          integer. When a gate fired this MUST be the capped value, never
          aggregate_uncapped.
        - feedback: exactly 3 recommendations, most impactful first. When a gate fired,
          item 1 MUST be the blocking amendment — falsifier_xexam.resolution when
          resolution_known is true, otherwise falsifier_result.falsification — with
          impact "blocking". Fill the remaining slots from the deduped material cons of
          rubric_result and coverage_result (excluding any prefixed "(minor)") and the
          discarded_pros across the scorers. Mark an item "blocking" only when the plan
          should not be handed off until it is addressed. If fewer than 3 genuine
          recommendations exist, use real minor improvements marked "non-blocking" for
          the rest — never fabricate an issue to reach the count.
      user: |
        rubric_result: {{rubric_result}}
        coverage_result: {{coverage_result}}
        falsifier_result: {{falsifier_result}}
        rubric_xexam: {{rubric_xexam}}
        coverage_xexam: {{coverage_xexam}}
        falsifier_xexam: {{falsifier_xexam}}
      placeholder: history
