---
description: Tracks when a Duo Agent Platform supervisor delegates a task to one of its sub-agents via delegate_task
internal_events: true
action: duo_workflow_subagent_delegated
product_group: agent_execution
product_categories:
  - duo_agent_platform
additional_properties:
  label:
    description: Name of the supervisor component that delegated the task
  property:
    description: Name of the sub-agent the task was delegated to (e.g. review_agent)
  value:
    description: Workflow Id that can be used to connect this event to others that happen during the same workflow.
  subsession_id:
    description: Supervisor-scoped ID of the sub-agent subsession that was started or resumed
  is_resume:
    description: Whether an existing subsession was resumed rather than a new one started
  delegation_count:
    description: Number of delegations made by this supervisor so far in the workflow, including this one
  parallel:
    description: Whether the parallel supervisor produced this delegation. delegation_count and is_resume are not comparable across the sequential and parallel supervisors, so slice on this before aggregating either
  flow_version:
    description: Concrete revision of the flow config that ran (e.g. 2.1.0-interactive). Absent for legacy flows. Needed because category carries only the flow name, so every revision of a flow shares one bucket
  schema_version:
    description: Flow config schema version the flow was loaded under (v1 or experimental). Absent for legacy flows
milestone: '19.5'
introduced_by_url: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/6604
tiers:
  - premium
  - ultimate
