---
description: Tracks LLM token usage for requests to the generate_embeddings_codebase unit primitive
internal_events: true
action: token_usage_generate_embeddings_codebase
product_group: dap_repository_flows
product_categories:
  - code_suggestions
additional_properties:
  label:
    description: Always cache_details; the cache token counts are sent as extra properties alongside it
  cache_read:
    description: Number of input tokens read from the prompt cache
  cache_creation:
    description: Number of input tokens written to the prompt cache
  ephemeral_5m_input_tokens:
    description: Number of input tokens written to the 5-minute TTL prompt cache
  ephemeral_1h_input_tokens:
    description: Number of input tokens written to the 1-hour TTL prompt cache
  input_characters:
    description: Number of input characters (Unicode code points, excluding whitespace) submitted to the embedding model; used to cost models billed per input characters, such as Vertex AI text-embedding-005
milestone: '19.5'
introduced_by_url: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/6799
tiers:
  - free
  - premium
  - ultimate
