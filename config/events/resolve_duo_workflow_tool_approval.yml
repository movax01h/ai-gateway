---
description: Tracks resolution of a pending Duo Workflow tool approval. Outcomes are approval, rejection, and modification (rejected with feedback for the agent). Agent Platform surfaces emit one event per tool call that required approval; chat emits one event per user decision and trusts the client's resume message, so a stale or replayed decision still counts. Delivery is best-effort at-least-once, and legacy pre-v1 flows do not emit this event
internal_events: true
action: resolve_duo_workflow_tool_approval
product_group: compliance
product_categories:
  - duo_agent_platform
additional_properties:
  label:
    description: Flow type (e.g. chat, software_development)
  property:
    description: "Approval outcome: approval, rejection, or modification (rejected with feedback)"
  value:
    description: Workflow Id that can be used to connect this event to others that happen during the same workflow.
  tool_name:
    description: Name of the tool whose approval was resolved (omitted when not known at resolution time)
milestone: '19.3'
introduced_by_url: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/6429
tiers:
  - premium
  - ultimate
