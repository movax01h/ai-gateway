additional_properties:
  label:
    description: Where the call ran, native when the model provider ran it inside the model request, agentcore when the AgentCore web search tool ran it
  property:
    description: Web tool that ran, web_search or web_fetch
  value:
    description: Workflow Id that connects this event to others in the same session
  status:
    description: success when the provider or gateway completed the call without an error, even with zero results; failure when it returned an error or never completed the call
