---
description: Tracks when a Duo Agent Platform sub-agent finishes and returns control to its supervisor. Sub-agent failures still emit this event with status error, so it normally pairs one-to-one with duo_workflow_subagent_delegated; a flow terminating between the two (abort, cancellation, crash) leaves a delegated with no returned, which is the expected cause of any count mismatch rather than data loss
internal_events: true
action: duo_workflow_subagent_returned
product_group: agent_execution
product_categories:
  - duo_agent_platform
additional_properties:
  label:
    description: Name of the supervisor component the sub-agent returned to
  property:
    description: Name of the sub-agent that returned (e.g. review_agent)
  value:
    description: Workflow Id that can be used to connect this event to others that happen during the same workflow.
  subsession_id:
    description: Supervisor-scoped ID of the sub-agent subsession that returned
  status:
    description: "Delegation outcome: completed when the sub-agent produced a final answer, error when it did not"
  parallel:
    description: Whether the parallel supervisor produced this delegation
  flow_version:
    description: Concrete revision of the flow config that ran (e.g. 2.1.0-interactive). Absent for legacy flows. Needed because category carries only the flow name, so every revision of a flow shares one bucket
  schema_version:
    description: Flow config schema version the flow was loaded under (v1 or experimental). Absent for legacy flows
milestone: '19.5'
introduced_by_url: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/6604
tiers:
  - premium
  - ultimate
