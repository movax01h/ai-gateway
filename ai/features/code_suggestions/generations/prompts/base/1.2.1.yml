---
name: Code Generations Agent
model:
  params:
    temperature: 0.2
    max_tokens: 2048
unit_primitive: generate_code
models_from: code_generations
prompt_template:
  system: |
    {% include 'code_suggestions/generations/jinja_template/dotcom/system/1.1.0.jinja' %}
  user: |
    {{user_instruction}}
params:
  stop:
    - "UNABLE_TO_GENERATE"
    # The few-shot examples GitLab Rails sends wrap answers in <new_code>, and Claude 5.x
    # sometimes copies the closing tag. Stopping on it keeps the tag out of the suggestion.
    - "</new_code>"
