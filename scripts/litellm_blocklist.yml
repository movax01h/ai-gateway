# litellm versions that must never be installed.
#
# We have twice had to exclude a known-bad litellm release by hand, once in an
# MR that was never merged (!5010, excluding 1.82.7 and 1.82.8) and once by
# downgrading in production (!5755, away from 1.85.0). This file gives that
# practice a permanent home so the knowledge is not lost when the MR is closed.
#
# `specifier` is any PEP 440 specifier. Checked by scripts/litellm_blocklist.py
# against the installed version, in the tests:litellm-conformance CI job.
#
# Remove an entry only when the upstream issue is confirmed fixed in a release
# we can move to, and say so in the merge request.

blocked:
  - specifier: "==1.82.7"
    reason: >-
      Known-bad release. Excluded in !5010.
    upstream: https://github.com/BerriAI/litellm/issues/24521

  - specifier: "==1.82.8"
    reason: >-
      Known-bad release. Excluded in !5010.
    upstream: https://github.com/BerriAI/litellm/issues/24521

  - specifier: ">=1.85.0,<1.88.0"
    reason: >-
      Rewrites empty assistant text content into the placeholder
      "[System: Empty message content sanitised to satisfy protocol]" before
      building Anthropic requests, even when a tool_call is present. The
      placeholder leaked into user-visible Duo Chat (#2335) and forced a
      downgrade to 1.84.x. ai_gateway/models/v2/litellm_empty_text_patch.py
      now patches this, so the range is blocked only for versions before the
      patch landed alongside the 1.88.0 bump in !6165.
    upstream: https://github.com/BerriAI/litellm/issues/24498

  - specifier: ">=1.92.0,<1.99.1"
    reason: >-
      Bedrock requests fail with
      "'NoneType' object has no attribute 'access_key'" when
      AWS_BEARER_TOKEN_BEDROCK is set without AWS access keys or a profile.
      Broke AIGW staging deployments and blocked production
      (gitlab-com/gl-infra/production#22949, S3). Reverted in !6952 and
      re-fixed in !6956 by moving to a range that includes the upstream fix.
    upstream: https://gitlab.com/gitlab-org/modelops/applied-ml/code-suggestions/ai-assist/-/merge_requests/6829
